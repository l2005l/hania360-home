<title>השנה שלנו · Hania360</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700;900&display=swap">
<style>
/* "השנה שלנו": the family's year with Hania360, as a story of full-screen slides. The numbers come from the person's own
   backup (/api/year); without an account there is a sample year. Tap to go on, hold to pause, share a picture at the end. */
:root{--ink:#fff;--font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;--kid:"Fredoka","Rubik",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0B0618;color:var(--ink);font-family:var(--font);direction:rtl;overscroll-behavior:none}
button,a{font:inherit;color:inherit}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#frame{position:relative;width:min(100vw,calc(100vh * .5625 + 40px));height:100%;max-width:520px;overflow:hidden;background:#140A2E;box-shadow:0 0 120px rgba(0,0,0,.6)}
@media (min-width:700px){#frame{height:min(100vh,940px);border-radius:28px}}
#bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));inset-inline:12px;display:flex;gap:4px;z-index:20;direction:rtl}
#bars i{flex:1;height:3.5px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
#bars i b{display:block;height:100%;width:100%;background:#fff;transform:scaleX(0);transform-origin:right center}
#bars i.done b{transform:scaleX(1)}
#top{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));inset-inline:12px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px}
#brand{font-weight:700;font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
#brand span{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 9px;font-size:11.5px}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.22);display:grid;place-items:center;font-size:17px;cursor:pointer;text-decoration:none}
#slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:84px 26px 70px;text-align:center;overflow:hidden;animation:enter .7s cubic-bezier(.2,.8,.2,1) both}
.slide.out{animation:leave .45s ease-in both}
@keyframes enter{from{opacity:0;transform:scale(1.06)}}
@keyframes leave{to{opacity:0;transform:scale(.96)}}
.inner{position:relative;z-index:2;display:grid;gap:10px;justify-items:center}
.deco{position:absolute;inset:0;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.75;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(var(--dx,40px),var(--dy,-30px)) scale(1.15)}}
.float{position:absolute;font-size:var(--s,34px);animation:float var(--t,7s) ease-in-out infinite;animation-delay:var(--d0,0s);opacity:.95;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.2,.9,.25,1.25) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.92)}to{opacity:1;transform:none}}
.kicker{margin:0;font-family:var(--kid);font-weight:600;font-size:17px;letter-spacing:.02em;opacity:.9;background:rgba(255,255,255,.16);border-radius:99px;padding:5px 14px}
h1,h2{margin:0;font-family:var(--kid);font-weight:700;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(52px,16vw,84px)}
h2{font-size:clamp(28px,8.4vw,40px)}
.big{font-weight:900;font-size:clamp(72px,24vw,128px);line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 8px 40px rgba(0,0,0,.25)}
.unit{font-family:var(--kid);font-weight:600;font-size:22px;margin-top:-4px}
.lead{margin:0;font-size:17px;line-height:1.5;opacity:.92;max-width:34ch;text-wrap:balance}
.small{font-size:14px;opacity:.8}
.rows{width:100%;display:grid;gap:9px;margin-top:10px}
.rowk{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-weight:700;font-size:16px}
.rowk .av{font-size:26px;width:36px;text-align:center}
.rowk .bar{height:14px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.rowk .bar b{display:block;height:100%;border-radius:9px;background:var(--bar,#FFD66B);width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.rowk .n{font-variant-numeric:tabular-nums;min-width:3ch;text-align:start}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:8px 14px;font-weight:600;font-size:15px}
.tiles{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tile{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:14px 10px 12px;display:grid;gap:2px;justify-items:center}
.tiles>.tile:last-child:nth-child(odd){grid-column:span 2}
.tile .e{font-size:30px}.tile b{font-size:30px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}.tile small{font-size:13px;opacity:.85;line-height:1.3}
.note{background:#FFF6D8;color:#3A2A10;border-radius:6px 6px 18px 6px;padding:14px 16px 12px;font-family:var(--kid);font-weight:500;font-size:18px;line-height:1.35;box-shadow:0 14px 30px -12px rgba(80,40,0,.45);text-align:start;width:min(100%,330px)}
.note small{display:block;margin-top:6px;font-family:var(--font);font-size:12.5px;opacity:.65}
.notes{display:grid;gap:12px;justify-items:center;width:100%}
.btn{border:0;border-radius:18px;padding:14px 20px;font-family:var(--kid);font-weight:700;font-size:18px;cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.light{background:#fff;color:#2A0F57}.btn.ghost{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;position:relative;z-index:5}
#hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;font-size:13px;opacity:.7;z-index:20;pointer-events:none;transition:opacity .6s}
#tapL,#tapR{position:absolute;top:70px;bottom:0;z-index:10}
#tapL{left:0;width:68%}#tapR{right:0;width:32%}
.demo{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:21;background:#FFD66B;color:#3A2400;font-weight:700;font-size:12.5px;border-radius:99px;padding:4px 12px}
canvas.confetti{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
/* themes */
.t-cover{background:linear-gradient(160deg,#2B0B5E 0%,#8E1A8C 48%,#FF7A3D 100%)}
.t-apps{background:linear-gradient(165deg,#062F4A 0%,#0F6E8C 55%,#2FC7B9 100%)}
.t-stars{background:radial-gradient(ellipse at 50% 20%,#3E26B8 0%,#1A0F5C 55%,#0A0630 100%)}
.t-eve{background:linear-gradient(180deg,#0B1240 0%,#3B2C93 55%,#E07AA8 100%)}
.t-moments{background:linear-gradient(170deg,#FF9B6A 0%,#FF6F91 55%,#C850C0 100%)}
.t-prize{background:linear-gradient(160deg,#FF3D7F 0%,#FF7A59 55%,#FFC94D 100%)}
.t-chores{background:linear-gradient(165deg,#07402F 0%,#13865A 55%,#9BE15D 100%)}
.t-learn{background:linear-gradient(165deg,#141F7A 0%,#3F35C8 55%,#8E6BFF 100%)}
.t-fit{background:linear-gradient(160deg,#FF5E3A 0%,#FF2A68 60%,#B4005F 100%)}
.t-fun{background:linear-gradient(165deg,#00445C 0%,#00A6A6 55%,#C9F25A 100%)}
.t-end{background:radial-gradient(ellipse at 50% 0%,#5B2BD6 0%,#1C0B4A 55%,#0B0618 100%)}
.gold{color:#FFD66B}
@media (prefers-reduced-motion:reduce){.blob,.float{animation:none}.pop{animation-duration:.01s}}
:focus-visible{outline:3px solid #FFD66B;outline-offset:2px}
</style>
<div id="stage"><div id="frame">
  <div id="slides" aria-live="polite"></div>
  <div id="tapR" role="button" aria-label="הקודם" tabindex="0"></div><div id="tapL" role="button" aria-label="הבא" tabindex="0"></div>
  <div id="bars" aria-hidden="true"></div>
  <div id="top"><div id="brand">השנה שלנו <span id="yr"></span></div><a class="ib" id="close" href="/" aria-label="סגירה, חזרה ל־Hania360">✕</a></div>
  <div id="hint">נוגעים כדי להמשיך · לחיצה ארוכה עוצרת</div>
</div></div>
<script>/*APP*/</script>
