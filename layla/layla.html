<title>HaniaLayla · לילה טוב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<script src="/hebcal.js" defer></script>
<style>
/* HaniaLayla: the last minutes before sleep, for small children. A night sky where the child says goodnight to the
   stars one by one until the moon falls asleep; soft sounds and old lullabies made on the phone (nothing downloaded,
   nothing recorded); breathing with a bubble; a star projector night light; Shema before sleep with the four angels.
   Everything stays on the phone. On Shabbat and holidays the app rests (a light started before Shabbat keeps going). */
:root{--ink:#F6F1FF;--muted:#C9C0EA;--gold:#FFD66B;--rose:#FF9EC7;--sky:#130C3A;--glass:rgba(32,22,84,.52);--line:rgba(255,255,255,.14);
  --kid:"Fredoka","Rubik",system-ui,sans-serif;--font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Frank Ruhl Libre","David",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0B0726;color:var(--ink);font-family:var(--font);direction:rtl;overscroll-behavior:none}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:14px;display:flex;align-items:flex-start;gap:10px;z-index:5;pointer-events:none;transition:opacity .8s}
#hello{flex:1;min-width:0;pointer-events:auto}
#hello h1{margin:0;font-family:var(--kid);font-weight:700;font-size:clamp(26px,7vw,40px);line-height:1.05;text-shadow:0 2px 18px rgba(120,80,255,.55);letter-spacing:.01em}
#hello p{margin:4px 0 0;color:var(--muted);font-size:14px}
.ib{pointer-events:auto;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:20px;flex:none}
#dock{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));inset-inline:10px;z-index:5;display:flex;justify-content:center;gap:8px;transition:opacity .8s,transform .8s}
#dock button{flex:1 1 0;max-width:120px;min-width:0;border-radius:22px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--kid);font-weight:600;font-size:13.5px;line-height:1.15;transition:transform .2s}
#dock button span{font-size:27px;line-height:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
#dock button:active{transform:scale(.94)}
#dock button.on{background:rgba(255,214,107,.22);border-color:rgba(255,214,107,.6)}
#now{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;border-radius:99px;font-size:14px;white-space:nowrap;transition:opacity .8s}
#now b{font-weight:600}#now .eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
#now .eq i{width:3px;background:var(--gold);border-radius:2px;animation:eq 1.1s ease-in-out infinite}
#now .eq i:nth-child(2){animation-delay:-.4s}#now .eq i:nth-child(3){animation-delay:-.8s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
#now button{border:0;background:rgba(255,255,255,.14);border-radius:99px;width:32px;height:32px}
body.quiet #top,body.quiet #dock,body.quiet #now{opacity:0;pointer-events:none}
body.quiet #dock{transform:translateY(30px)}
/* sheets */
#scrim{position:fixed;inset:0;z-index:9;background:rgba(5,3,20,.45);opacity:0;pointer-events:none;transition:opacity .35s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:10;max-height:86vh;overflow-y:auto;border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(40,27,104,.94),rgba(20,13,60,.97));border:1px solid var(--line);border-bottom:0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.7);
  transform:translateY(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.85,.2,1)}
.sheet.open{transform:none}
.grab{width:46px;height:5px;border-radius:9px;background:rgba(255,255,255,.28);margin:0 auto 12px}
.sheet h2{margin:0 0 4px;font-family:var(--kid);font-weight:700;font-size:26px}
.sheet .sub{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.sheet h3{margin:18px 0 8px;font-size:15px;font-weight:700;color:var(--muted)}
@media (min-width:760px){.sheet{max-width:620px;margin:0 auto;border-radius:30px;bottom:16px;border-bottom:1px solid var(--line)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{position:relative;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--kid);font-weight:600;font-size:14px;text-align:center;transition:transform .2s,background .2s}
.tile span{font-size:34px;line-height:1}
.tile:active{transform:scale(.95)}
.tile.on{background:linear-gradient(160deg,rgba(255,214,107,.3),rgba(255,158,199,.18));border-color:rgba(255,214,107,.7);box-shadow:0 0 30px -8px rgba(255,214,107,.6)}
.tile.on::after{content:"";position:absolute;top:8px;inset-inline-start:10px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:pulse 1.6s infinite}
.tile.busy span{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.3}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:99px;padding:8px 14px;font-size:14.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--gold);color:#2A1A00;border-color:var(--gold);font-weight:700}
.vol{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.vol input{flex:1}
input[type=range]{accent-color:var(--gold);height:30px}
.btn{border:0;border-radius:18px;padding:13px 18px;font-family:var(--kid);font-weight:600;font-size:17px;background:linear-gradient(135deg,#FFD66B,#FF9EC7);color:#2A1240;box-shadow:0 10px 30px -10px rgba(255,170,150,.7)}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.wide{width:100%;margin-top:14px}
.field{display:grid;gap:6px;margin-top:6px}
.field input,.field select{font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.field select option{color:#111}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px}
.tog input{width:22px;height:22px;accent-color:var(--gold)}
.fine{font-size:12.5px;color:var(--muted);line-height:1.55}
.fine a{color:var(--muted)}
/* breathing */
#breath{position:fixed;inset:0;z-index:8;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 42%,#2E1F7A,#140C42 55%,#08051C);opacity:0;pointer-events:none;transition:opacity .6s}
#breath.on{opacity:1;pointer-events:auto}
#bubble{width:min(62vw,62vh,330px);aspect-ratio:1;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:min(20vw,92px);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),rgba(173,150,255,.45) 28%,rgba(120,90,255,.25) 60%,rgba(255,158,199,.25));
  box-shadow:0 0 80px rgba(160,130,255,.55),inset -18px -24px 60px rgba(90,60,200,.35),inset 10px 14px 40px rgba(255,255,255,.25);transform:scale(.55);transition-property:transform;transition-timing-function:cubic-bezier(.45,0,.55,1)}
#bword{margin-top:34px;font-family:var(--kid);font-size:clamp(28px,8vw,44px);font-weight:700;min-height:1.3em;transition:opacity .4s}
#bcount{margin-top:8px;color:var(--muted);font-size:15px;min-height:1.4em}
#bclose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:14px}
#bmode{margin-top:22px}
/* Shema */
#shema{position:fixed;inset:0;z-index:8;overflow-y:auto;background:radial-gradient(ellipse at 50% 0%,#3A2A8A,#120B38 60%,#0A0622);opacity:0;pointer-events:none;transition:opacity .6s;padding:calc(70px + env(safe-area-inset-top,0px)) 20px calc(110px + env(safe-area-inset-bottom,0px))}
#shema.on{opacity:1;pointer-events:auto}
#shema .page{max-width:620px;margin:0 auto;text-align:center}
#shema .verse{font-family:var(--serif);font-size:clamp(28px,7.6vw,44px);line-height:1.55;font-weight:700;margin:0 0 18px;text-shadow:0 2px 24px rgba(160,130,255,.45)}
#shema .verse.small{font-size:clamp(21px,5.4vw,28px);font-weight:500;line-height:1.75}
#shema .verse.quiet{font-size:clamp(20px,5vw,26px);font-weight:500;color:var(--muted)}
#shema .ph{transition:color .5s,text-shadow .5s;border-radius:8px}
#shema .ph.lit{color:var(--gold);text-shadow:0 0 22px rgba(255,214,107,.7)}
#shema .note{color:var(--muted);font-size:14px;margin:0 0 20px}
#shnav{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:9}
#shdots{display:flex;gap:7px}#shdots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .3s,transform .3s}
#shdots i.on{background:var(--gold);transform:scale(1.25)}
#shclose{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:14px;z-index:9}
#angels{width:min(100%,380px);margin:4px auto 10px;display:block;overflow:visible}
#angels .orb{transition:opacity .6s,transform .6s;transform-box:fill-box;transform-origin:center}
#angels .orb.dim{opacity:.28}
#angels text{font-family:var(--kid);font-weight:600;fill:#F6F1FF;font-size:15px;text-anchor:middle}
/* night */
#night{position:fixed;inset:0;z-index:12;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s}
#night.on{opacity:1;pointer-events:auto}
#night canvas{width:100%;height:100%;display:block}
#nhint{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;color:rgba(255,255,255,.55);font-size:14px;transition:opacity 1s;pointer-events:none}
#nring{position:absolute;width:86px;height:86px;border-radius:50%;border:3px solid rgba(255,214,107,.0);pointer-events:none;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity .2s}
#nring.go{opacity:1;border-color:rgba(255,214,107,.8);transform:translate(-50%,-50%) scale(1.15);transition:transform .7s linear,opacity .2s}
/* the end of the goodnights */
#finale{position:fixed;inset:0;z-index:7;display:grid;place-items:center;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.6s}
#finale.on{opacity:1}
#finale>div{padding:34px 26px;border-radius:40px;background:radial-gradient(ellipse at center,rgba(12,7,44,.82) 30%,rgba(12,7,44,0) 72%)}
#finale h2{margin:0;font-family:var(--kid);font-weight:700;font-size:clamp(34px,10vw,64px);text-shadow:0 4px 40px rgba(255,214,107,.6)}
#finale p{color:var(--muted);margin:8px 0 22px;font-size:16px}
#finale .row{justify-content:center;pointer-events:auto}
#toast{position:fixed;top:calc(84px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-10px);z-index:30;padding:10px 16px;border-radius:16px;font-size:15px;opacity:0;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#rest{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,#3B2A10,#0B0726 70%)}
#rest .c{font-size:64px}#rest h2{margin:8px 0 4px;font-family:var(--kid);font-size:32px}#rest p{margin:0;color:#E5D3B3}
#rest button{margin-top:22px;opacity:.75}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0B0726;transition:opacity 1.1s;pointer-events:none}
#splash b{font-family:var(--kid);font-size:44px;font-weight:700;letter-spacing:.02em;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
#splash i{display:block;font-style:normal;font-size:60px;text-align:center;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}}
@media (prefers-reduced-motion:reduce){#splash b,#splash i{animation:none}.tile.on::after,#now .eq i{animation:none}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
<canvas id="scene" aria-label="שמי לילה: כוכבים, ירח, גבעות ובית קטן. נוגעים בכוכב כדי להגיד לו לילה טוב" role="img"></canvas>
<div id="top">
  <div id="hello"><h1 id="hi">לילה טוב</h1><p id="hip">נוגעים בכוכב ואומרים לו לילה טוב</p></div>
  <button class="ib glass" id="set" type="button" aria-label="הגדרות להורים">⚙️</button>
</div>
<div id="now" class="glass" hidden><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><b id="nowT"></b><span id="nowR"></span><button type="button" id="nowStop" aria-label="לעצור את הצלילים">⏸</button></div>
<nav id="dock" aria-label="מה עושים">
  <button class="glass" type="button" id="dStars"><span>⭐</span>לילה טוב</button>
  <button class="glass" type="button" id="dSound"><span>🎵</span>צלילים</button>
  <button class="glass" type="button" id="dBreath"><span>🫧</span>נושמים</button>
  <button class="glass" type="button" id="dNight"><span>🌌</span>מנורה</button>
  <button class="glass" type="button" id="dShema"><span>🙏</span>שמע</button>
</nav>
<div id="finale"><div><h2 id="finT">לילה טוב</h2><p id="finP">כל הכוכבים כבר ישנים. גם הירח.</p><div class="row" id="finB"></div></div></div>
<div id="breath" role="dialog" aria-label="נושמים עם הבועה"><button class="ib glass" id="bclose" type="button" aria-label="סגירה">✕</button>
  <div><div id="bubble" aria-hidden="true"></div><div id="bword" aria-live="polite"></div><div id="bcount"></div>
  <div class="row" id="bmode" style="justify-content:center"></div></div></div>
<div id="shema" role="dialog" aria-label="קריאת שמע על המיטה"><div class="page" id="shpage"></div></div>
<button class="ib glass" id="shclose" type="button" aria-label="סגירה" hidden>✕</button>
<div id="shnav" hidden><button class="btn ghost" id="shprev" type="button">→ הקודם</button><div id="shdots"></div><button class="btn" id="shnext" type="button">הבא ←</button></div>
<div id="night" aria-label="מנורת לילה. לחיצה ארוכה ליציאה"><canvas id="ncv"></canvas><div id="nring"></div><div id="nhint">לחיצה ארוכה ליציאה</div></div>
<div id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></section>
<div id="toast" class="glass" role="status"></div>
<div id="rest" hidden><div><div class="c">🕯️</div><h2 id="restT">שבת שלום</h2><p id="restP"></p><button class="btn ghost" id="restOff" type="button">לכבות את מצב שבת במכשיר הזה</button></div></div>
<div id="splash"><div><i>🌙</i><b>לילה טוב</b></div></div>
<script>/*APP*/</script>
