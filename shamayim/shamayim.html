<title>HaniaShamayim · השמיים מעליך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap">
<style>
/* HaniaShamayim: the sky above you, live. One full-screen canvas draws the sky (sky.js); glass panels float on it.
   Everything is computed on the phone: the stars (Hipparcos, via d3-celestial), the Sun, Moon and planets (Astronomy
   Engine), the space station (its orbit from CelesTrak, via our server, and satellite.js). */
:root{--ink:#EEF2FF;--muted:#A7B0D6;--glass:rgba(14,20,48,.62);--glass2:rgba(26,34,78,.7);--line:rgba(160,175,255,.18);--gold:#F5C76B;--cyan:#7DD3FC;--rose:#F9A8D4;--font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Frank Ruhl Libre","Rubik",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#02040C;color:var(--ink);font-family:var(--font);direction:rtl;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--line);box-shadow:0 10px 40px -18px rgba(0,0,0,.8)}
button{font:inherit;color:inherit}
.ib{appearance:none;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;min-width:44px;height:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s,background .2s}
.ib:active{transform:scale(.94)}.ib.on{background:linear-gradient(135deg,rgba(125,211,252,.35),rgba(167,139,250,.35));border-color:rgba(125,211,252,.6)}
/* top bar */
#top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline:10px;display:flex;gap:8px;align-items:center;z-index:5}
#title{flex:0 1 auto;margin-inline-end:auto;min-width:0;max-width:420px;padding:7px 14px;border-radius:16px;display:flex;flex-direction:column;cursor:pointer}
#title b{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.1;letter-spacing:.01em}
#title span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the time pill */
#timebar{position:fixed;bottom:calc(196px + env(safe-area-inset-bottom,0px));inset-inline-start:10px;z-index:5;display:flex;gap:6px;align-items:center;transition:bottom .35s cubic-bezier(.2,.8,.2,1)}
#timebar .ib{height:40px;min-width:40px;font-variant-numeric:tabular-nums}
#tlabel.away{border-color:var(--gold);color:var(--gold)}
#arrow{position:fixed;z-index:4;width:64px;height:64px;margin:-32px;pointer-events:none;display:grid;place-items:center;transition:opacity .3s}
#arrow i{display:block;width:0;height:0;border-inline:16px solid transparent;border-bottom:30px solid var(--gold);filter:drop-shadow(0 0 10px rgba(245,199,107,.9))}
#arrow b{position:absolute;top:66px;white-space:nowrap;font-size:13px;color:var(--gold);text-shadow:0 1px 6px #000}
/* the cards along the bottom */
#cards{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));inset-inline:0;z-index:5;display:flex;gap:10px;overflow-x:auto;padding:4px 10px 6px;scroll-snap-type:x mandatory;scrollbar-width:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
#cards::-webkit-scrollbar{display:none}
#cards.hide{transform:translateY(120%);opacity:0}
.card{flex:0 0 min(74vw,280px);scroll-snap-align:start;border-radius:22px;padding:14px 15px;min-height:168px;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative;overflow:hidden;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}.card:nth-child(5){animation-delay:.24s}.card:nth-child(6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.96)}}
.card .k{font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.card h3{margin:0;font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.2}
.card p{margin:0;font-size:14px;color:#D5DBF7;line-height:1.45}
.card .big{position:absolute;inset-inline-end:-8px;top:-6px;font-size:64px;opacity:.16;pointer-events:none}
.card.gold{border-color:rgba(245,199,107,.35)}.card.gold h3{color:var(--gold)}
.card canvas{position:absolute;inset-inline-end:12px;top:12px}
.pl{display:flex;gap:6px;flex-wrap:wrap}.pl span{font-size:13px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
/* sheets */
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:20;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:78vh;overflow-y:auto;transform:translateY(calc(100% + 60px));transition:transform .42s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.sheet.open{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sheet h2{margin:2px 0 2px;font-family:var(--serif);font-size:28px;font-weight:700}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.facts div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.facts small{display:block;color:var(--muted);font-size:12px}.facts b{font-size:16px;font-variant-numeric:tabular-nums}
.kid{background:linear-gradient(135deg,rgba(245,199,107,.15),rgba(249,168,212,.12));border:1px solid rgba(245,199,107,.3);border-radius:16px;padding:10px 12px;font-size:15px;line-height:1.5;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:0;border-radius:14px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#7DD3FC,#A78BFA);color:#0A0F2C}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line)}
.list{display:grid;gap:6px;margin:8px 0}
.list button{appearance:none;display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:start;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:11px 13px;font-size:15px;cursor:pointer}
.list button small{color:var(--muted);font-size:13px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15.5px}
.tog input{width:22px;height:22px;accent-color:#7DD3FC}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=search]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);outline:none}
#scrim{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}#scrim.on{opacity:1;pointer-events:auto}
/* splash */
#splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none;transition:opacity 1.2s ease}
#splash div{text-align:center;animation:sp 2.4s cubic-bezier(.2,.8,.2,1) both}
#splash h1{margin:0;font-family:var(--serif);font-size:clamp(38px,11vw,64px);font-weight:900;letter-spacing:.02em;background:linear-gradient(180deg,#FFF6DA,#F5C76B);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(245,199,107,.25)}
#splash p{margin:6px 0 0;color:var(--muted);font-size:16px}
@keyframes sp{0%{opacity:0;transform:translateY(12px) scale(.97);filter:blur(6px)}35%{opacity:1;filter:blur(0);transform:none}80%{opacity:1}100%{opacity:0}}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-10px);z-index:40;padding:10px 16px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#game{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:6;padding:10px 16px;border-radius:18px;text-align:center;min-width:240px}
#game b{font-family:var(--serif);font-size:22px;color:var(--gold);display:block}
#game small{color:var(--muted)}
#reticle{position:fixed;left:50%;top:50%;width:54px;height:54px;margin:-27px;border:2px dashed rgba(245,199,107,.7);border-radius:50%;z-index:4;pointer-events:none;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.red #sky,body.red .glass,body.red .ib{filter:sepia(1) saturate(4) hue-rotate(-45deg) brightness(.75)}
.credit{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}
.credit a{color:var(--cyan)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){.card{flex-basis:260px}#cards .card:first-child{margin-inline-start:auto}#cards .card:last-child{margin-inline-end:auto}.sheet{max-width:560px;margin:0 auto;border-radius:26px;bottom:16px}}
</style>
<canvas id="sky" aria-label="מפת השמיים החיה"></canvas>
<div id="top">
  <div id="title" class="glass" role="button" tabindex="0" aria-label="מיקום ושעה"><b>השמיים מעליך</b><span id="where">…</span></div>
  <button class="ib" id="find" type="button" aria-label="חיפוש בשמיים">🔍</button>
  <button class="ib" id="gyro" type="button" aria-label="לכוון את הטלפון לשמיים">📱</button>
  <button class="ib" id="menu" type="button" aria-label="תצוגה">☰</button>
</div>
<div id="timebar">
  <button class="ib" id="tlabel" type="button" aria-label="מסע בזמן">🕐 <span id="tl">עכשיו</span></button>
  <button class="ib" id="play" type="button" aria-label="להריץ את הזמן">⏩</button>
</div>
<div id="arrow" hidden><i></i><b id="arrowT"></b></div>
<div id="reticle" hidden></div>
<div id="game" class="glass" hidden><small>מצאו בשמיים את</small><b id="gameT"></b><small id="gameH"></small></div>
<div id="cards"></div>
<div id="scrim"></div>
<section class="sheet glass" id="sheet" aria-modal="true" role="dialog"><div class="grab"></div><div id="sheetBody"></div></section>
<div id="toast" class="glass" role="status"></div>
<div id="splash"><div><h1>השמיים מעליך</h1><p>כוכבים, ירח וכוכבי לכת, עכשיו, מעל המקום שלך</p></div></div>
<script src="/sky.js?v=@SKYV@"></script>
