<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מועדון הערב · Hania360</title>
<meta name="description" content="משחקי ערב שה־AI כותב במיוחד בשבילכם: רצח בארוחת ערב, טריוויה, שיר ליום הולדת וחדר בריחה.">
<meta name="theme-color" content="#13211c">
<meta property="og:title" content="מועדון הערב · Hania360">
<meta property="og:locale" content="he_IL">
<link rel="canonical" href="https://play.hania360.com/">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/play-192.png">
<link rel="apple-touch-icon" href="/icons/play-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow "card table" column on green felt; each game screen is dealt in like a card */
:root{
  --felt:#13211c; --felt-2:#1b2e27; --felt-3:#223a31; --ivory:#efe6d2; --muted:#b5ab95;
  --brass:#c9a45c; --blood:#a8322b; --line:#33463e; --ok:#6fbf8a; --paper-ink:#2a2219;
  --display:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --body:"Assistant","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--felt)}
.btnlink{display:inline-block;text-decoration:none;text-align:center;font-weight:700;border-radius:4px;padding:13px 18px;border:1px solid var(--brass)}
a.demo{text-decoration:none;color:var(--muted)}
body{background:var(--felt);color:var(--ivory);font-family:var(--body);font-size:17px;line-height:1.6;margin:0;
  background-image:radial-gradient(ellipse at 50% 0%,var(--felt-2),var(--felt) 70%);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{background:none;border:0;padding:0;color:var(--brass);font-family:var(--display);font-size:1.25rem;font-weight:900;cursor:pointer}
.demo{font-size:.75rem;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:3px 10px}
#app{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;color:var(--brass);font-weight:700}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2.3rem;font-weight:900}
h2{font-size:1.6rem}
h3{font-size:1.25rem}
p{margin:0}
.lead{color:var(--muted)}
.small{font-size:.85rem;color:var(--muted)}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent);opacity:.6}
.stack{display:flex;flex-direction:column;gap:12px}
/* hub */
.games{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:520px){.games{grid-template-columns:1fr 1fr}}
.game{background:var(--felt-2);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:right;color:var(--ivory);font:inherit;cursor:pointer}
.game:hover{border-color:var(--brass)}
.game .price{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;border-top:1px solid var(--line)}
.game .price b{font-family:var(--display);font-size:1.3rem;color:var(--brass);font-variant-numeric:tabular-nums}
.glyph{font-family:var(--display);font-size:2rem;color:var(--brass);line-height:1}
/* paper card */
.card{background:var(--ivory);color:var(--paper-ink);border-radius:6px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #d8cbb0}
.card .eyebrow{color:#8a6a2c}
.card h2,.card h3{color:#1d1711}
.card .k{font-weight:700;color:#6b2a24}
.card .small{color:#6b5d48}
.secret{border-top:1px dashed #b9a681;padding-top:12px}
.killer{background:var(--blood);color:#fff;border-radius:4px;padding:10px 12px;font-weight:700}
/* forms */
label{font-weight:600;font-size:.95rem}
.field{display:flex;flex-direction:column;gap:6px}
input,textarea,select{width:100%;min-width:0;background:var(--felt-2);color:var(--ivory);border:1px solid var(--line);border-radius:4px;padding:11px 12px;font:inherit}
textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:4px;padding:13px 18px;border:1px solid var(--brass)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--brass);color:#1a140c}
.ghost{background:transparent;color:var(--brass)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns button{flex:1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{background:var(--felt-2);color:var(--ivory);border-color:var(--line);font-weight:600;padding:12px 10px;text-align:center;line-height:1.3}
.seg button[aria-pressed="true"]{border-color:var(--brass);background:var(--felt-3);color:var(--brass)}
.seg small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.err{color:#ff9b8f;font-size:.92rem}
.note{background:var(--felt-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:.92rem;color:var(--muted)}
/* lists */
.clue{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-block:12px}
.clue:last-child{border-bottom:0}
.clue b{font-family:var(--display);color:var(--brass);font-size:1.3rem;line-height:1.2;min-width:1.2em;font-variant-numeric:tabular-nums}
.pick{display:flex;flex-direction:column;gap:8px}
.pick button{background:var(--felt-2);color:var(--ivory);border-color:var(--line);text-align:right;display:flex;justify-content:space-between;gap:10px;font-weight:600}
.pick button[aria-pressed="true"]{border-color:var(--blood);background:#3a1b18}
.pick button.right{border-color:var(--ok);background:#1d3b2a}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--brass)}
/* payment */
.summary{display:flex;flex-direction:column;gap:6px}
.summary div{display:flex;justify-content:space-between;gap:12px}
.summary .total{border-top:1px solid #b9a681;padding-top:10px;margin-top:4px;font-weight:700;font-size:1.15rem}
.summary .total b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.paper input{background:#fff;color:var(--paper-ink);border-color:#cbbd9f}
.paper .seg button{background:#fff;color:var(--paper-ink);border-color:#cbbd9f}
.paper .seg button[aria-pressed="true"]{border-color:#8a6a2c;background:#f6edd9;color:#5a4318}
.paper .primary{border-color:#8a6a2c}
.spinner{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brass);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:30px}
/* scores */
.scores{display:flex;flex-wrap:wrap;gap:8px}
.scores span{background:var(--felt-2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.88rem;font-variant-numeric:tabular-nums}
.scores b{color:var(--brass)}
.board{display:flex;flex-direction:column}
.board div{display:flex;justify-content:space-between;padding-block:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.board div:first-child{color:var(--brass);font-weight:700;font-size:1.15rem}
.list{display:flex;flex-direction:column}
.list div{display:flex;justify-content:space-between;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.list .on{color:var(--ok)}
.code{font-family:var(--display);font-size:3.2rem;font-weight:900;letter-spacing:.2em;direction:ltr;color:#1d1711;line-height:1}
.offers{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:520px){.offers{grid-template-columns:1fr 1fr}}
.offer{border:1px solid var(--brass);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--felt-2)}
.offer b.big{font-family:var(--display);font-size:1.6rem;color:var(--brass);font-variant-numeric:tabular-nums}
.mine{display:flex;flex-direction:column;gap:10px}
.mine .item{background:var(--felt-2);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mine .item .btns button{padding:9px 12px;font-size:.92rem;flex:1 1 140px}
.status{display:flex;flex-wrap:wrap;gap:8px}
.status span{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.88rem}
.status span.on{border-color:var(--ok);color:var(--ok)}
.joinlink{background:none;border:1px dashed var(--line);color:var(--ivory);font-weight:600;text-align:center}
.lyrics{white-space:pre-wrap;font-family:var(--display);font-size:1.15rem;line-height:1.7;margin:0}
.timer{font-family:var(--display);font-size:2rem;color:var(--brass);font-variant-numeric:tabular-nums}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
@media (prefers-reduced-motion:no-preference){.stage{animation:deal .35s ease-out}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
@keyframes deal{from{transform:translateY(8px)}to{transform:none}}
</style>
</head>
<body>

<div class="wrap" dir="rtl" lang="he">
  <header class="top"><button class="brand" id="homeBtn">מועדון הערב</button><a class="demo" id="who" href="#">כניסה</a></header>
  <main id="app" class="stage"></main>
</div>

<script>
const app=document.getElementById('app');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ME={signedIn:false,payments:'demo',loginUrl:'https://pass.hania360.com/'};
let ORDER=null;
async function api(path,body){
  try{
    const res=await fetch(path,body===undefined?{credentials:'same-origin'}:{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-hania-play':'1'},body:JSON.stringify(body)});
    const data=await res.json().catch(()=>({}));
    return Object.assign({ok:res.ok,status:res.status},data);
  }catch{return{ok:false,status:0,error:'network',message:'אין חיבור לאינטרנט. בדקו את החיבור ונסו שוב.'}}
}
const wsUrl=p=>(location.protocol==='https:'?'wss://':'ws://')+location.host+p;
let tick=null,LIVE=null,P=null;
function view(html){clearInterval(tick);if(LIVE)LIVE.hook=null;app.innerHTML=html;window.scrollTo(0,0);app.classList.remove('stage');void app.offsetWidth;app.classList.add('stage')}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
const norm=s=>String(s??'').toLowerCase().replace(/[\s"'״׳.,!?\-]/g,'').replace(/^ה(?=.{2,})/,'');
const HEB="אבגדהוזחטיכלמנסעפצקרשת";
const teamName=i=>`קבוצה ${HEB[i]}'`;

/* ---------- live room: host side ---------- */
async function startLive(teams){
  if(!ORDER||!ORDER.gameId)return false;
  const r=await api('/api/rooms',{gameId:ORDER.gameId,teams});
  if(!r.ok)return false;
  LIVE={code:r.code,token:r.hostToken,teams,counts:{},seen:{},answers:{},state:null,cards:{},hook:null,ws:null,closed:false};
  connectHost(LIVE);return true;
}
function connectHost(L){
  const ws=new WebSocket(wsUrl(`/ws/${L.code}?role=host&token=${encodeURIComponent(L.token)}`));L.ws=ws;
  ws.onopen=()=>{if(L.state)ws.send(JSON.stringify({t:'state',state:L.state}));Object.entries(L.cards).forEach(([k,c])=>ws.send(JSON.stringify({t:'card',team:+k,card:c})))};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
    if(m.t==='peers'){L.counts=m.counts||{};L.seen=m.seen||{}}
    else if(m.t==='answers'){L.answers=m.answers||{}}
    else if(m.t==='answer'){(L.answers[m.qk]=L.answers[m.qk]||{})[m.team]={ans:m.ans,at:m.at}}
    if(LIVE===L&&L.hook)L.hook()};
  ws.onclose=()=>{if(LIVE===L&&!L.closed)setTimeout(()=>{if(LIVE===L)connectHost(L)},2000)};
}
function stopLive(){if(!LIVE)return;LIVE.closed=true;try{LIVE.ws.close()}catch{}LIVE=null}
function hostSend(m){if(LIVE&&LIVE.ws&&LIVE.ws.readyState===1)LIVE.ws.send(JSON.stringify(m))}
function live(state){if(!LIVE)return;state.teams=LIVE.teams;LIVE.state=state;hostSend({t:'state',state})}
function resend(){if(!LIVE)return;Object.entries(LIVE.cards).forEach(([k,c])=>hostSend({t:'card',team:+k,card:c}))}
function connectedTeams(){return LIVE?LIVE.counts:{}}
function teamAnswers(qk){const a=(LIVE&&LIVE.answers[qk])||{},m={};Object.entries(a).forEach(([k,v])=>{m[k]={ans:v.ans,t:v.at}});return m}
async function lobby(names,title,next){
  view(`<div class="center"><div class="spinner"></div><h3>פותחים חדר משחק</h3></div>`);
  const ok=await startLive(names);
  if(!ok){view(`<div class="stack"><div class="eyebrow">משחק מהטלפונים</div><h2>לא הצלחנו לפתוח חדר משחק</h2>
    <p class="lead">ממשיכים במצב מנחה אחד, שבו המנחה מסמן את התשובות. זה עובד מצוין גם ככה.</p></div>
    <button class="primary" id="b">המשיכו</button>`);$('b').onclick=next;return}
  live({phase:'lobby',title});
  view(`<div class="stack"><div class="eyebrow">חדר המשחק פתוח</div><h2>${esc(title)}</h2>
    <p class="lead">כל קבוצה פותחת בטלפון את <b dir="ltr">play.hania360.com/join</b> ומקלידה את הקוד:</p></div>
    <div class="card" style="align-items:center;text-align:center"><div class="eyebrow">קוד המשחק</div><div class="code">${LIVE.code}</div></div>
    <div class="list" id="lt"></div>
    <p class="small">אפשר להתחיל גם אם לא כל הקבוצות התחברו. קבוצה בלי טלפון עונה בקול, והמנחה מסמן אותה.</p>
    <button class="primary" id="b">התחילו את המשחק</button>`);
  const draw=()=>{const ct=connectedTeams();$('lt').innerHTML=names.map((n,k)=>`<div><span>${esc(n)}</span><span class="small ${ct[k]?'on':''}">${ct[k]?`${ct[k]} מחוברים ✓`:'מחכים...'}</span></div>`).join('')};
  LIVE.hook=draw;draw();
  $('b').onclick=next;
}
function liveCount(qk,n){const a=teamAnswers(qk);const k=Object.keys(a).length;return `התקבלו תשובות מ־${k} מתוך ${n} קבוצות`}

/* ---------- live room: phone side ---------- */
function joinView(prefill,errMsg){
  view(`<div class="stack"><div class="eyebrow">משתתפים</div><h2>הצטרפות למשחק</h2><p class="lead">הקלידו את הקוד שמופיע על המסך של המנחה. לא צריך חשבון.</p></div>
  <div class="field"><label for="jc">קוד משחק</label><input id="jc" inputmode="numeric" maxlength="4" dir="ltr" autocomplete="off" value="${esc(prefill||'')}" style="font-size:2rem;text-align:center;letter-spacing:.3em"></div>
  <p id="err" class="err" hidden></p><button class="primary" id="b">הצטרפו</button>`);
  const e=$('err');if(errMsg){e.textContent=errMsg;e.hidden=false}
  $('jc').onkeydown=ev=>{if(ev.key==='Enter')$('b').click()};
  $('b').onclick=()=>{const code=$('jc').value.trim();e.hidden=true;
    if(!/^\d{4}$/.test(code)){e.textContent="הקוד הוא 4 ספרות.";e.hidden=false;return}
    $('b').disabled=true;$('b').textContent="מתחברים...";
    leavePlayer();
    P={code,team:null,state:null,cards:{},ans:{},show:false,last:'',teams:[],ws:null,closed:false,opened:false};
    openPlayer(P)};
}
function openPlayer(p){
  const ws=new WebSocket(wsUrl(`/ws/${p.code}?role=player`));p.ws=ws;
  ws.onopen=()=>{p.opened=true;if(p.team!=null)ws.send(JSON.stringify({t:'join',team:p.team}));phoneRender(true)};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
    if(m.t==='hello'){p.teams=Array.isArray(m.teams)?m.teams:[];phoneRender(true)}
    else if(m.t==='state'&&m.state&&typeof m.state==='object'){p.state=m.state;phoneRender()}
    else if(m.t==='card'&&m.card&&p.team!=null){p.cards[p.team]=m.card;phoneRender(true)}};
  ws.onclose=()=>{if(P!==p||p.closed)return;
    if(!p.opened){P=null;joinView(p.code,"לא מצאנו משחק עם הקוד הזה. בדקו את הקוד על המסך של המנחה.");return}
    setTimeout(()=>{if(P===p&&!p.closed)openPlayer(p)},2000)};
}
function leavePlayer(){if(!P)return;P.closed=true;try{P.ws.close()}catch{}P=null}
function pres(patch){
  if(!P||!P.ws||P.ws.readyState!==1)return;
  const send=m=>P.ws.send(JSON.stringify(m));
  if(Number.isInteger(patch.team))send({t:'join',team:patch.team});
  if(patch.seen)send({t:'seen'});
  if(patch.qk&&patch.ans!=null)send({t:'answer',qk:patch.qk,ans:patch.ans});
}
function phoneRender(force){
  if(!P)return;const s=P.state;
  const key=JSON.stringify([s,P.team,!!P.cards[P.team],P.show,P.ans]);
  if(!force&&key===P.last)return;P.last=key;
  const teams=(s&&Array.isArray(s.teams))?s.teams:(P.teams||[]);
  if(!teams.length){view(`<div class="center"><div class="spinner"></div><h3>מחוברים לחדר ${esc(P.code)}</h3><p class="small">מחכים למנחה...</p></div>`);return}
  if(P.team==null||P.team>=teams.length){
    view(`<div class="stack"><div class="eyebrow">חדר ${esc(P.code)} · ${esc((s&&s.title)||'')}</div><h2>באיזו קבוצה אתם?</h2></div>
    <div class="pick">${teams.map((t,k)=>`<button data-k="${k}"><span>${esc(t)}</span></button>`).join('')}</div>`);
    app.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{P.team=+b.dataset.k;P.ans={};pres({team:P.team,qk:null,ans:null,seen:false});phoneRender(true)});
    return;
  }
  const me=teams[P.team];
  const head=`<div class="eyebrow">${esc(me)} · חדר ${esc(P.code)}</div>`;
  if(!s){view(`${head}<h2>אתם בפנים!</h2><p class="lead">מחכים שהמנחה יתחיל את המשחק. השאירו את המסך פתוח.</p>`);return}
  const strip=Array.isArray(s.scores)?scoreStrip(s.scores):'';
  const ph=s.phase;
  if(ph==='lobby'){
    view(`${head}<h2>אתם בפנים!</h2><p class="lead">מחכים שהמנחה יתחיל את המשחק. השאירו את המסך פתוח.</p><button class="ghost" id="sw">החלפת קבוצה</button>`);
    $('sw').onclick=()=>{P.team=null;phoneRender(true)};
  }else if(ph==='deal'){
    const c=P.cards[P.team];
    if(!c){view(`${head}<div class="center"><div class="spinner"></div><p>הדמות שלכם בדרך...</p></div>`);return}
    if(!P.show){view(`${head}<h2>הדמות שלכם מוכנה</h2><p class="lead">התקבצו סביב הטלפון, כך שרק חברי הקבוצה רואים.</p><button class="primary" id="b">הציגו את הדמות שלנו</button>`);
      $('b').onclick=()=>{P.show=true;pres({seen:true});phoneRender(true)};return}
    view(`${head}${charCard(c,true)}<button class="ghost" id="b">הסתירו</button>`);$('b').onclick=()=>{P.show=false;phoneRender(true)};
  }else if(ph==='round'){
    const c=P.cards[P.team];
    view(`${head}<h2>סבב ${(s.r|0)+1} מתוך ${s.total|0}</h2>${c?`<p class="lead">אתם משחקים את <b style="color:var(--brass)">${esc(c.name)}</b></p>`:''}

    const typed=$('pa')&&P.lastQ===qk?$('pa').value:'';P.lastQ=qk;
    view(`${head}${strip}<div class="eyebrow">חידה ${(s.i|0)+1} מתוך ${s.total|0}</div>

    ${s.solvedBy?`<h2>${esc(s.solvedBy)} פתרה ראשונה</h2><p class="lead">התשובה: ${esc(s.answer)}</p>`:s.answer!=null?`<p class="lead">התשובה: ${esc(s.answer)}</p>`:`

    <button class="primary" id="b">שלחו תשובה</button>`}`);
    if($('b')){$('pa').value=typed;$('pa').onkeydown=e=>{if(e.key==='Enter')$('b').click()};$('b').onclick=()=>{const v=$('pa').value.trim().slice(0,60);if(!v)return;P.ans[qk]=v;pres({qk,ans:v});phoneRender(true)}}
  }else if(ph==='end'){
    view(`${head}<div class="eyebrow">סוף המשחק</div><h1>${esc(s.headline||'')}</h1>
    ${Array.isArray(s.board)?`<div class="board">${s.board.map(t=>`<div><span>${esc(t.name)}</span><span>${t.score|0}</span></div>`).join('')}</div>`:''}`);
  }
}

  ${liveField('m_live',c)}`}
  ${priceBar('murder',c)}
  <p id="err" class="err" hidden></p>
  <button class="primary" id="go">המשך לתשלום</button>`);
  const read=()=>{c.topic=$('m_topic').value.trim();if(c.mode==='small')c.names=$('m_names').value;else{c.people=+$('m_people').value;c.teams=+$('m_teams').value}};
  const upd=()=>{read();$('pbar').outerHTML=priceBar('murder',c);if(c.mode==='teams'){const per=c.teams?Math.round(c.people/c.teams):0;$('m_split').textContent=`כ־${per} אנשים בכל קבוצה`}};

  if($('m_live'))bindSeg('m_live',v=>{read();c.live=v==='1';cfgMurder()});
  app.querySelectorAll('input,textarea').forEach(i=>i.oninput=upd);upd();
  $('go').onclick=()=>{read();const e=$('err');e.hidden=true;
    if(!c.topic){e.textContent="כתבו נושא לערב.";e.hidden=false;return}
    let units;
    if(c.mode==='small'){const names=c.names.split('\n').map(s=>s.trim()).filter(Boolean);
      if(names.length<4||names.length>8){e.textContent="בערב חברים צריך בין 4 ל־8 משתתפים.";e.hidden=false;return}
      units=names;
    }else{
      if(!(c.people>=9&&c.people<=100)){e.textContent="בגיבוש צריך בין 9 ל־100 משתתפים.";e.hidden=false;return}
      if(!(c.teams>=3&&c.teams<=10)){e.textContent="בחרו בין 3 ל־10 קבוצות.";e.hidden=false;return}
      if(c.people/c.teams<2){e.textContent="צריך לפחות 2 אנשים בכל קבוצה.";e.hidden=false;return}
      units=Array.from({length:c.teams},(_,i)=>teamName(i));
    }
    const p=priceOf('murder',c);
    pay('murder',[["משחק",GAMES.murder.name],["נושא",c.topic],["מסלול",p.tier],[c.mode==='small'?"משתתפים":"קבוצות",String(units.length)]],p.price,()=>genMurder(units));
  };
}

async function pay(key,lines,price,next){
  const back=()=>cfgOf(key)();
  if(!ME.signedIn){needLogin({key,cfg:CFG[key]},back);return}
  view(`<div class="center"><div class="spinner"></div><h3>מכינים את ההזמנה</h3></div>`);
  const r=await api('/api/orders',{game:key,cfg:CFG[key]});
  if(!r.ok){if(r.status===401){ME.signedIn=false;pay(key,lines,price,next);return}payError(back,r.message||'משהו השתבש. נסו שוב בעוד רגע.');return}
  ORDER=r.order;

function restoreCfg(game,cfg){

async function replay(gameId){

  ORDER=Object.assign({},r.order,{gameId:r.gameId});
  restoreCfg(r.game,r.order.cfg);
  const sample=r.source==='sample';
  if(r.game==='murder')startMurder(r.content,murderUnitsFromCfg(),sample);
  else if(r.game==='trivia')startTrivia(r.content,sample);

/* ---------- AI generation (server) ---------- */
function loading(what){view(`<div class="center"><div class="spinner"></div><h3>ה־AI כותב ${what}</h3><p class="small">זה לוקח בדרך כלל 20 עד 60 שניות. אל תסגרו את הדף.</p></div>`)}
async function serverGen(useSample){
  const r=await api(`/api/orders/${ORDER.id}/generate`,{useSample:!!useSample});
  if(!r.ok)return{error:{code:r.error,message:r.message}};
  ORDER.gameId=r.gameId;ORDER.gensLeft=r.gensLeft;

}
function failView(e,retry,useSample){
  const none=e.code==='no_generations_left';
  const msg=e.message||(e.code==='network'?'אין חיבור לאינטרנט.':'היצירה לא הצליחה הפעם.');

  if(none){$('h').onclick=home;return}

}

/* ---------- murder: generate & play ---------- */
const DETECTIVE={name:"בלש/ית מהמשטרה",role:"חוקר/ת שהגיע/ה לזירה",look:"מעיל ארוך, פנקס",secret:"אין לך סוד. את/ה כאן כדי לפענח.",goal:"לשאול שאלות קשות ולחשוף את הרוצח.",task:"הכינו 3 שאלות חוקרות לחשודים.",killer:false};

let M=null;
function murderUnitsFromCfg(){const c=CFG.murder;return c.mode==='small'?(Array.isArray(c.names)?c.names:String(c.names).split('\n')).map(s=>String(s).trim()).filter(Boolean):Array.from({length:c.teams},(_,i)=>teamName(i))}
async function genMurder(units,useSample){
  units=units||murderUnitsFromCfg();
  loading("את העלילה שלכם");
  const r=await serverGen(useSample);
  if(r.error){failView(r.error,()=>genMurder(units),()=>genMurder(units,true));return}
  startMurder(r.data,units,r.isSample);
}
function charCard(c,teams,label){
  return `<div class="card">
      <div class="eyebrow">${label?esc(label)+', ':''}${teams?'אתם משחקים את':'את/ה'}:</div>
      <h2>${esc(c.name)}</h2>
      <p><span class="k">תפקיד:</span> ${esc(c.role)}</p>
      <p><span class="k">מראה:</span> ${esc(c.look)}</p>
      <div class="secret"><p><span class="k">הסוד:</span> ${esc(c.secret)}</p></div>
      <p><span class="k">המטרה:</span> ${esc(c.goal)}</p>
      ${teams&&c.task?`<p><span class="k">משימה קבוצתית לסבב 1:</span> ${esc(c.task)}</p>`:''}
      ${c.killer?`<p class="killer">${teams?'הקבוצה שלכם היא הרוצחת. שמרו את זה בתוך הקבוצה.':'אתה הרוצח. אל תגלה לאף אחד.'}</p>`:`<p class="small">${teams?'הקבוצה שלכם לא רצחה':'את/ה לא הרוצח'}, אבל יש מה להסתיר.</p>`}
    </div>`;
}
function startMurder(d,units,isSample){
  let chars=d.chars.slice(0,units.length);
  while(chars.length<units.length)chars.push(DETECTIVE);
  const killer=chars.find(x=>x.killer);const rest=shuffle(chars.filter(x=>x!==killer));
  chars=shuffle([killer,...rest]);
  M={d,isSample,teams:CFG.murder.mode==='teams',units:units.map((u,i)=>({label:u,char:chars[i]})),i:0,shown:false,round:0};
  if(M.teams&&CFG.murder.live)lobby(units,d.title,murderIntro);else murderIntro();
}
function murderIntro(){
  view(`<div class="stack"><div class="eyebrow">${esc(M.d.setting)}</div><h1>${esc(M.d.title)}</h1><p class="lead">${esc(M.d.intro)}</p></div>

function bar(n,i){return `<div class="progress">${Array.from({length:n},(_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`}
function murderDeal(){

function murderLiveDeal(){

function murderTable(){

function murderVote(){
  const opts=M.units.map((u,k)=>`<option value="${k}">${esc(u.char.name)}</option>`).join('');
  if(M.teams){
    live({phase:'vote',suspects:M.units.map(u=>u.char.name)});

    <div class="stack">${M.units.map((u,i)=>`<div class="field"><label for="v${i}">${esc(u.label)}</label><select id="v${i}"><option value="">בחרו חשוד</option>${opts}</select></div>`).join('')}</div>

        $('vc').textContent=liveCount('vote',M.units.length)};

function murderReveal(votes){

  live({phase:'reveal',killer:killer.char.name,killerTeam:killer.label,solution:String(M.d.solution||'').slice(0,1200),winners});
  view(`<div class="eyebrow">החשיפה</div><h1>${M.teams?'והרוצח הוא...':right?'תפסתם את הרוצח!':'הרוצח חמק'}</h1>

  const c=CFG.trivia;
  view(`${header('trivia')}
  <div class="field"><label for="t_topic">נושא החידון</label><input id="t_topic" value="${esc(c.topic)}" placeholder="למשל: סרטים, החברה שלנו, כדורגל, שנות ה־80"></div>
  <div class="two">
    <div class="field"><label for="t_teams">מספר קבוצות</label><input id="t_teams" type="number" min="2" max="20" value="${c.teams}"></div>
    <div class="field"><label for="t_count">שאלות</label><select id="t_count">${[8,10,15].map(n=>`<option ${n==c.count?'selected':''}>${n}</option>`).join('')}</select></div>
  </div>
  <div class="field"><label for="t_level">רמת קושי</label><select id="t_level">${["קלה","בינונית","קשה"].map(n=>`<option ${n==c.level?'selected':''}>${n}</option>`).join('')}</select></div>
  ${liveField('t_live',c)}
  ${priceBar('trivia',c)}
  <p id="err" class="err" hidden></p>
  <button class="primary" id="go">המשך לתשלום</button>`);
  const read=()=>{c.topic=$('t_topic').value.trim();c.teams=+$('t_teams').value;c.count=+$('t_count').value;c.level=$('t_level').value};
  app.querySelectorAll('input,select').forEach(i=>i.oninput=()=>{read();$('pbar').outerHTML=priceBar('trivia',c)});
  bindSeg('t_live',v=>{read();c.live=v==='1';cfgTrivia()});
  $('go').onclick=()=>{read();const e=$('err');
    if(!c.topic){e.textContent="כתבו נושא לחידון.";e.hidden=false;return}
    if(!(c.teams>=2&&c.teams<=20)){e.textContent="בחרו בין 2 ל־20 קבוצות.";e.hidden=false;return}
    const p=priceOf('trivia',c);
    pay('trivia',[["משחק",GAMES.trivia.name],["נושא",c.topic],["מסלול",p.tier],["קבוצות",String(c.teams)]],p.price,genTrivia)};
}
let T=null;
async function genTrivia(useSample){
  loading("את שאלות החידון");
  const r=await serverGen(useSample);
  if(r.error){failView(r.error,()=>genTrivia(),()=>genTrivia(true));return}
  startTrivia(r.data,r.isSample);
}
function startTrivia(qs,isSample){
  const names=Array.from({length:CFG.trivia.teams},(_,i)=>teamName(i));
  T={qs,isSample,i:0,revealed:false,got:new Set(),teams:names.map(name=>({name,score:0}))};
  if(CFG.trivia.live)lobby(names,`חידון: ${CFG.trivia.topic}`,triviaQ);else triviaQ();
}
function scoreStrip(teams){return `<div class="scores">${teams.map(t=>`<span>${esc(t.name)} <b>${t.score|0}</b></span>`).join('')}</div>`}
function triviaQ(){
  const q=T.qs[T.i];
  live({phase:'q',i:T.i,total:T.qs.length,q:q.q,options:q.options,revealed:T.revealed,answer:T.revealed?q.answer:null,scores:T.teams});
  view(`${T.isSample&&T.i===0?`<div class="note">אלה שאלות מוכנות מראש.</div>`:''}
  ${scoreStrip(T.teams)}
  <div class="eyebrow">שאלה ${T.i+1} מתוך ${T.qs.length}</div>
  <h2>${esc(q.q)}</h2>
  <div class="pick">${q.options.map((o,k)=>`<button class="${T.revealed&&k===q.answer?'right':''}" tabindex="-1"><span>${HEB[k]}. ${esc(o)}</span>${T.revealed&&k===q.answer?'<span>✓</span>':''}</button>`).join('')}</div>
  ${T.revealed?`${q.fact?`<p class="small">${esc(q.fact)}</p>`:''}
    <div class="field"><label>${LIVE?'הקבוצות שצדקו (סומנו אוטומטית, אפשר לתקן)':'אילו קבוצות צדקו?'}</label><div class="seg" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${T.teams.map((t,k)=>`<button type="button" data-k="${k}" aria-pressed="${T.got.has(k)}">${esc(t.name)}</button>`).join('')}</div></div>
    <button class="primary" id="b">${T.i<T.qs.length-1?'לשאלה הבאה':'לתוצאות'}</button>`:`${LIVE?`<p class="small" id="ac"></p>`:''}<button class="primary" id="b">חשפו את התשובה</button>`}`);
  if(LIVE&&!T.revealed){const qk='t'+T.i;const draw=()=>{$('ac').textContent=liveCount(qk,T.teams.length)};LIVE.hook=draw;draw()}
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;T.got.has(k)?T.got.delete(k):T.got.add(k);b.setAttribute('aria-pressed',T.got.has(k))});
  $('b').onclick=()=>{
    if(!T.revealed){
      if(LIVE){const a=teamAnswers('t'+T.i);T.got=new Set(Object.entries(a).filter(([,v])=>v.ans===q.answer).map(([k])=>+k).filter(k=>k<T.teams.length))}
      T.revealed=true;triviaQ();return}
    T.got.forEach(k=>T.teams[k].score++);T.got=new Set();T.revealed=false;T.i++;
    T.i<T.qs.length?triviaQ():triviaEnd()};
}
function triviaEnd(){
  const s=T.teams.slice().sort((a,b)=>b.score-a.score);
  live({phase:'end',headline:`${s[0].name} ניצחה!`,board:s});
  view(`<div class="eyebrow">סוף החידון</div><h1>${esc(s[0].name)} ניצחה!</h1>
  <div class="board">${s.map(t=>`<div><span>${esc(t.name)}</span><span>${t.score} נקודות</span></div>`).join('')}</div>
  <div class="btns"><button class="primary" id="again">חידון חדש</button><button class="ghost" id="h">לכל המשחקים</button></div>`);
  $('again').onclick=()=>{stopLive();cfgTrivia()};$('h').onclick=home;
}

function cfgSong(){

  view(`${header('song')}
  <div class="two">
    <div class="field"><label for="s_name">שם החוגג/ת</label><input id="s_name" value="${esc(c.name)}"></div>
    <div class="field"><label for="s_age">גיל</label><input id="s_age" value="${esc(c.age)}"></div>
  </div>
  <div class="field"><label for="s_hob">תחביבים ודברים שהוא/היא אוהב/ת</label><input id="s_hob" value="${esc(c.hobbies)}"></div>
  <div class="field"><label for="s_jokes">בדיחות פנימיות והרגלים מצחיקים</label><textarea id="s_jokes">${esc(c.jokes)}</textarea><span class="small">הפרטים כאן הם דוגמה. כתבו את שלכם.</span></div>
  <div class="field"><label for="s_style">סגנון</label><select id="s_style">${["פופ שמח","ראפ","בלדה מרגשת","מזרחית קצבית","שיר ילדים"].map(n=>`<option ${n==c.style?'selected':''}>${n}</option>`).join('')}</select></div>
  ${priceBar('song',c)}
  <p id="err" class="err" hidden></p>
  <button class="primary" id="go">המשך לתשלום</button>`);
  $('go').onclick=()=>{c.name=$('s_name').value.trim();c.age=$('s_age').value.trim();c.hobbies=$('s_hob').value.trim();c.jokes=$('s_jokes').value.trim();c.style=$('s_style').value;
    if(!c.name){$('err').textContent="כתבו את שם החוגג/ת.";$('err').hidden=false;return}
    const p=priceOf('song',c);
    pay('song',[["מוצר",GAMES.song.name],["עבור",c.name],["סגנון",c.style]],p.price,genSong)};
}
function songShell(){
  const c=CFG.song;
  view(`<div class="stack"><div class="eyebrow">${esc(c.style)}</div><h2>השיר של ${esc(c.name)}</h2></div>
  <div class="card"><p class="small" id="st">ה־AI כותב את השיר...</p><pre class="lyrics" id="ly"></pre></div>
  <div class="btns" id="acts" hidden><button class="primary" id="cp">העתיקו את המילים</button><button class="ghost" id="re" hidden>גרסה אחרת</button></div>
  <p class="small">בקרוב: לחן מושר וקובץ שמע לשליחה.</p>
  <button class="ghost" id="h">לכל המשחקים</button>`);
  $('h').onclick=home;
}
async function genSong(useSample){
  songShell();
  const r=await serverGen(useSample);
  if(r.error){failView(r.error,()=>genSong(),()=>genSong(true));return}
  songFill(r.data.text,r.isSample);
}
function songFill(text,isSample){
  $('ly').textContent=text;
  $('st').textContent='זה שיר מוכן מראש.';$('st').hidden=!isSample;
  $('acts').hidden=false;
  if(ORDER.gensLeft>0){$('re').hidden=false;$('re').textContent=`גרסה אחרת (נשארו ${ORDER.gensLeft})`;$('re').onclick=()=>genSong()}
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('ly').textContent);$('cp').textContent="הועתק"}catch{const rg=document.createRange();rg.selectNodeContents($('ly'));const sel=getSelection();sel.removeAllRanges();sel.addRange(rg);$('cp').textContent="סמנו והעתיקו"}};
}

/* ---------- escape room ---------- */
function cfgEscape(){
  const c=CFG.escape;
  view(`${header('escape')}
  <div class="field"><label for="e_topic">עולם המשחק</label><input id="e_topic" value="${esc(c.topic)}" placeholder="למשל: שוד בנק, פירמידה, המשרד שלנו"></div>
  <div class="field"><label for="e_aud">למי זה מיועד</label><select id="e_aud">${["ילדים 8–12","נוער","מבוגרים"].map(n=>`<option ${n==c.audience?'selected':''}>${n}</option>`).join('')}</select></div>
  <div class="field"><label>סוג הערב</label>${seg('e_mode',c.mode,[["small","קבוצה אחת","עד 8, נגד השעון"],["teams","גיבוש","מרוץ בין קבוצות"]])}</div>
  ${c.mode==='teams'?`<div class="two">
    <div class="field"><label for="e_people">משתתפים</label><input id="e_people" type="number" min="9" max="100" value="${c.people}"></div>
    <div class="field"><label for="e_teams">קבוצות</label><input id="e_teams" type="number" min="2" max="20" value="${c.teams}"></div></div>
    <div class="note">מקרינים את החידה על מסך, והקבוצה הראשונה שמביאה את התשובה הנכונה מקבלת נקודה.</div>
    ${liveField('e_live',c)}`:''}
  ${priceBar('escape',c)}
  <p id="err" class="err" hidden></p>
  <button class="primary" id="go">המשך לתשלום</button>`);
  const read=()=>{c.topic=$('e_topic').value.trim();c.audience=$('e_aud').value;if(c.mode==='teams'){c.people=+$('e_people').value;c.teams=+$('e_teams').value}};
  bindSeg('e_mode',v=>{read();c.mode=v;cfgEscape()});
  if($('e_live'))bindSeg('e_live',v=>{read();c.live=v==='1';cfgEscape()});
  app.querySelectorAll('input,select').forEach(i=>i.oninput=()=>{read();$('pbar').outerHTML=priceBar('escape',c)});
  $('go').onclick=()=>{read();const e=$('err');
    if(!c.topic){e.textContent="כתבו עולם למשחק.";e.hidden=false;return}
    if(c.mode==='teams'&&!(c.people>=9&&c.people<=100&&c.teams>=2&&c.teams<=20)){e.textContent="בגיבוש: 9 עד 100 משתתפים ו־2 עד 20 קבוצות.";e.hidden=false;return}
    const p=priceOf('escape',c);
    pay('escape',[["משחק",GAMES.escape.name],["עולם",c.topic],["מסלול",p.tier]],p.price,genEscape)};
}
let E=null;
async function genEscape(useSample){
  loading("את החידות");
  const r=await serverGen(useSample);
  if(r.error){failView(r.error,()=>genEscape(),()=>genEscape(true));return}
  startEscape(r.data,r.isSample);
}
function startEscape(d,isSample){
  const teams=CFG.escape.mode==='teams';
  const names=teams?Array.from({length:CFG.escape.teams},(_,i)=>teamName(i)):null;
  E={d,isSample,i:0,start:Date.now(),penalty:0,hint:false,wrong:{},teams:teams?names.map(name=>({name,score:0})):null};
  const intro=()=>{
    if(LIVE)live({phase:'lobby',title:d.title});
    view(`<div class="stack"><div class="eyebrow">חדר בריחה</div><h1>${esc(d.title)}</h1><p class="lead">${esc(d.intro)}</p></div>
    ${isSample?`<div class="note">אלה חידות מוכנות מראש.</div>`:''}
    <p class="small">${teams?(LIVE?'כל חידה מופיעה בטלפונים. הקבוצה הראשונה ששולחת תשובה נכונה מקבלת נקודה, אוטומטית.':'כל חידה מוצגת לכולם. הקבוצה הראשונה שמביאה תשובה נכונה מקבלת נקודה.'):'השעון מתחיל ללכת כשתלחצו. כל רמז מוסיף 2 דקות.'}</p>
    <button class="primary" id="b">התחילו</button>`);
    $('b').onclick=()=>{E.start=Date.now();escapeQ()};
  };
  if(teams&&CFG.escape.live)lobby(names,d.title,intro);else intro();
}
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
function escState(extra){const p=E.d.puzzles[E.i];live(Object.assign({phase:'p',i:E.i,total:E.d.puzzles.length,title:String(p.title||'').slice(0,200),riddle:String(p.riddle).slice(0,800),hint:E.hint?String(p.hint||'').slice(0,400):null,scores:E.teams,wrong:E.wrong,solvedBy:null,answer:null},extra||{}))}
function escapeQ(){
  const p=E.d.puzzles[E.i];
  const ok=v=>[p.answer,...(Array.isArray(p.alts)?p.alts:[])].some(a=>norm(a)!==''&&norm(a)===norm(v));
  if(E.teams)escState();
  view(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div class="eyebrow">חידה ${E.i+1} מתוך ${E.d.puzzles.length}</div><div class="timer" id="clock">${fmt(Date.now()-E.start+E.penalty)}</div></div>
  ${E.teams?scoreStrip(E.teams):''}
  <div class="card"><h3>${esc(p.title||'')}</h3><p style="font-size:1.15rem">${esc(p.riddle)}</p>${E.hint?`<p class="secret"><span class="k">רמז:</span> ${esc(p.hint)}</p>`:''}</div>
  ${LIVE&&E.teams?`<p class="small" id="ac"></p>`:''}
  <div class="field"><label for="ans">${LIVE&&E.teams?'או הקלידו תשובה שנאמרה בקול':'התשובה'}</label><input id="ans" autocomplete="off" placeholder="מילה אחת או מספר"></div>
  <p id="msg" class="err" hidden></p>
  <div class="btns"><button class="primary" id="chk">בדקו</button>${E.hint?'':`<button class="ghost" id="hint">רמז${E.teams?'':' (+2 דקות)'}</button>`}</div>
  ${E.teams?`<button class="ghost" id="skip">אף קבוצה לא פתרה, הציגו תשובה</button>`:''}`);
  tick=setInterval(()=>{const el=$('clock');if(el)el.textContent=fmt(Date.now()-E.start+E.penalty)},1000);
  if(LIVE&&E.teams){const qk='e'+E.i;
    const check=()=>{const a=teamAnswers(qk);let best=null,changed=false;
      for(const [k,v] of Object.entries(a)){const kk=+k;if(kk>=E.teams.length)continue;
        if(ok(v.ans)){if(!best||v.t<best.t)best={k:kk,t:v.t}}
        else if(E.wrong[kk]!==String(v.ans)){E.wrong[kk]=String(v.ans).slice(0,60);changed=true}}
      if(best){escapeSolved(best.k);return}
      if(changed)escState();
      $('ac').textContent=liveCount(qk,E.teams.length)+'. בודקים אוטומטית.'};
    LIVE.hook=check;check();}
  $('ans').onkeydown=e=>{if(e.key==='Enter')$('chk').click()};
  $('chk').onclick=()=>{const v=$('ans').value;
    if(!ok(v)){const m=$('msg');m.textContent="לא נכון. נסו שוב.";m.hidden=false;$('ans').classList.remove('shake');void $('ans').offsetWidth;$('ans').classList.add('shake');return}
    E.teams?escapeWho():escapeNext()};
  if($('hint'))$('hint').onclick=()=>{E.hint=true;if(!E.teams)E.penalty+=120000;escapeQ()};
  if($('skip'))$('skip').onclick=()=>{clearInterval(tick);if(E.teams)escState({answer:String(p.answer)});
    view(`<div class="center"><h2>התשובה: ${esc(p.answer)}</h2><button class="primary" id="n">לחידה הבאה</button></div>`);$('n').onclick=escapeNext};
}
function escapeSolved(k){
  const p=E.d.puzzles[E.i];E.teams[k].score++;clearInterval(tick);
  escState({solvedBy:E.teams[k].name,answer:String(p.answer)});
  view(`<div class="center"><div class="eyebrow">נשלח מהטלפון</div><h1>${esc(E.teams[k].name)} פתרה ראשונה!</h1><p class="lead">התשובה: ${esc(p.answer)}</p>${scoreStrip(E.teams)}<button class="primary" id="n">לחידה הבאה</button></div>`);
  $('n').onclick=escapeNext;
}
function escapeWho(){
  clearInterval(tick);
  view(`<div class="center"><h2>נכון!</h2><p class="lead">איזו קבוצה פתרה ראשונה?</p></div>
  <div class="seg" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${E.teams.map((t,k)=>`<button data-k="${k}" aria-pressed="false">${esc(t.name)}</button>`).join('')}</div>`);
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;E.teams[k].score++;if(LIVE)escState({solvedBy:E.teams[k].name,answer:String(E.d.puzzles[E.i].answer)});escapeNext()});
}
function escapeNext(){E.hint=false;E.wrong={};E.i++;E.i<E.d.puzzles.length?escapeQ():escapeEnd()}
function escapeEnd(){
  clearInterval(tick);const total=Date.now()-E.start+E.penalty;
  const s=E.teams&&E.teams.slice().sort((a,b)=>b.score-a.score);
  if(E.teams)live({phase:'end',headline:`${s[0].name} ניצחה`,board:s});
  view(`<div class="eyebrow">ברחתם!</div><h1>${E.teams?`${esc(s[0].name)} ניצחה`:`הזמן שלכם: ${fmt(total)}`}</h1>
  <p class="lead">${esc(E.d.outro||'')}</p>
  ${E.teams?`<div class="board">${s.map(t=>`<div><span>${esc(t.name)}</span><span>${t.score} חידות</span></div>`).join('')}</div>`:E.penalty?`<p class="small">כולל ${E.penalty/60000} דקות עונשין על רמזים</p>`:''}
  <div class="btns"><button class="primary" id="again">חדר חדש</button><button class="ghost" id="h">לכל המשחקים</button></div>`);
  $('again').onclick=()=>{stopLive();cfgEscape()};$('h').onclick=home;
}

async function boot(){
  const me=await api('/api/me');if(me.ok)ME=me;
  const who=$('who');
  who.textContent=ME.signedIn?(ME.user.displayName||ME.user.email):'כניסה';
  who.href=ME.signedIn?'https://hania360.com/':ME.loginUrl;
  const q=new URLSearchParams(location.search);
  if(location.pathname.replace(/\/$/,'')==='/join'){joinView(q.get('code')||'');return}
  let pend=null;try{pend=JSON.parse(sessionStorage.getItem('play_pending')||'null');sessionStorage.removeItem('play_pending')}catch{}
  if(pend&&pend.pass&&ME.signedIn){buyPass(pend.pass);return}
  if(pend&&GAMES[pend.key]&&ME.signedIn){Object.assign(CFG[pend.key],pend.cfg||{});cfgOf(pend.key)();return}
  home();
}
boot();
