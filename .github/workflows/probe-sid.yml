name: probe-sid
on: { push: { branches: [probe-sid] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for n in ashkenaz sefard mizrach; do for p in shacharit mincha arvit; do
            curl -s "https://dat.hania360.com/api/siddur/toc?n=$n&p=$p" | jq -c "{n:\"$n\",p:\"$p\",err:.error,secs:(.sections|length)}"; done; done
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          cat > s.mjs <<'X'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const n of ["ashkenaz", "mizrach"]) {
            const c = await b.newContext({ viewport: { width: 400, height: 880 }, timezoneId: "Asia/Jerusalem", locale: "he-IL" });
            await c.addInitScript((n) => localStorage.setItem("haniashabbat-v1", JSON.stringify({ city: "תל אביב", hav: "deg", before: 0, nusach: n })), n);
            const p = await c.newPage(); await p.goto("https://dat.hania360.com/"); await p.waitForTimeout(1500);
            await p.click("#tefSid"); await p.waitForTimeout(9000);
            const notes = await p.$$eval(".sidnote", (e) => e.map((x) => x.innerText));
            console.log("NOTES", n, JSON.stringify(notes));
            const t = await p.$("text=/ברך עלינו|בָּרֵךְ עָלֵינוּ|בָּרֵךְ עָלֵֽינוּ/");
            if (t) await t.scrollIntoViewIfNeeded();
            await p.screenshot({ path: "sid-" + n + ".png" });
          }
          await b.close();
          X
          node s.mjs
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: "*.png" }
