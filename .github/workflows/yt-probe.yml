name: yt-probe
on: { push: { branches: [masach-watch] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > t.mjs <<'X'
          import { ytItem } from "./masach/family.js";
          for (const u of ["https://youtu.be/dQw4w9WgXcQ","https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=PLFgquLnL59alCl_2TQvOiD5Vgm1hCaGSI","https://www.youtube.com/@KanEducational","https://www.youtube.com/@hopchannel","https://www.youtube.com/shorts/aqz-KE-bpKQ","https://example.com/x"]) console.log(u, JSON.stringify(await ytItem(u)));
          X
          sed -i 's#^import { okEndpoint.*#const okEndpoint=()=>true,subId=async()=>"",vapidKeys=async()=>({}),wake=async()=>true;#' masach/family.js
          node t.mjs
