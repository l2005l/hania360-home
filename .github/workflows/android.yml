# Builds the Hania360 Android app (android/) and publishes the APK at
# https://github.com/l2005l/hania360-home/releases/download/android-latest/Hania360.apk (hania360.com/app points there).
# The signing key: made here on the first signed run, kept in the repo only encrypted (android/release.jks.enc) with
# the ANDROID_KS_PASS secret, which the owner sets in GitHub settings. Without the secret it makes a test build only.
name: android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key
        env: { KS_PASS: "${{ secrets.ANDROID_KS_PASS }}" }
        run: |
          if [ -z "$KS_PASS" ]; then echo "::warning::No ANDROID_KS_PASS secret: test build only"; exit 0; fi
          K="$RUNNER_TEMP/r.jks"
          if [ -f android/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/release.jks.enc -out "$K" -pass env:KS_PASS
          else
            keytool -genkeypair -keystore "$K" -alias hania -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Hania360, O=Hania360, C=IL"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$K" -out android/release.jks.enc -pass env:KS_PASS
            echo NEWKEY=1 >> "$GITHUB_ENV"
          fi
          keytool -list -v -keystore "$K" -storepass "$KS_PASS" | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//' > android/fingerprint.txt
          echo "KS_FILE=$K" >> "$GITHUB_ENV"; echo SIGNED=1 >> "$GITHUB_ENV"
      - name: Build
        env: { KS_PASS: "${{ secrets.ANDROID_KS_PASS }}", VC: "${{ github.run_number }}" }
        run: cd android && gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/Hania360.apk"
      - uses: actions/upload-artifact@v4
        with: { name: Hania360-apk, path: "${{ runner.temp }}/Hania360.apk" }
      - name: Keep the key and its fingerprint
        if: env.SIGNED == '1' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "hania360-bot"; git config user.email "actions@users.noreply.github.com"
          git add android/release.jks.enc android/fingerprint.txt
          git diff --cached --quiet || (git commit -m "Android: signing key (encrypted) and fingerprint" && git push)
      - name: Publish
        if: env.SIGNED == '1' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Hania360 for Android" --notes "האפליקציה של Hania360 לאנדרואיד, עם ווידג'ט למסך הבית. להורדה: Hania360.apk"
          gh release upload android-latest "$RUNNER_TEMP/Hania360.apk" --clobber
