name: probe-sef3
on: { push: { branches: [probe-sef3] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          probe() { ref="$1"; ver="$2"; echo "=== $ref | $ver"
            curl -s -G "https://www.sefaria.org/api/v3/texts/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$ref")" --data-urlencode "version=hebrew|$ver" -D h.txt -o t.json; grep -i "access-control-allow-origin" h.txt
            jq -r '.versions[0] | "license=\(.license) title=\(.versionTitle)"' t.json
            jq -c '.versions[0].text | (if type=="array" then (flatten|map(select(type=="string"))) else [.] end) | {n: length, first: (.[0:3]|map(.[0:160]))}' t.json; }
          probe "Siddur Ashkenaz, Weekday, Shacharit, Amidah" "The Metsudah siddur, 1981"
          probe "Siddur Ashkenaz, Weekday, Shacharit, Amidah" "Daat Siddur Ashkenaz"
          probe "Siddur Sefard, Weekday Shacharit, Amidah" "Torat Emet 357"
          probe "Siddur Sefard, Weekday Shacharit, Amidah" "The Metsudah siddur, 1981"
          probe "Siddur Edot HaMizrach, Weekday Shacharit, Amida" " Shaliehsaboo Edition"
          probe "Siddur Edot HaMizrach, Weekday Shacharit, Amida" "Torat Emet 357"
          curl -s "https://www.sefaria.org/api/v2/raw/index/Siddur_Ashkenaz" | jq -r 'def en: ((.titles // [])[] | select(.lang=="en" and .primary) | .text); .schema.nodes[] | select((.titles[]|select(.primary and .lang=="en").text)=="Weekday") | .nodes[] | (en) as $p | .nodes[] | (en) as $s | "\($p) > \($s) : " + ([(.nodes // [])[] | en] | join(", "))'
