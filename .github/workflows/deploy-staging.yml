name: Deploy Hania360 home staging

# Staging only: hania360-home-staging on workers.dev. The live hania360.com is not touched.
on:
  workflow_dispatch:
  push:
    branches: [feature/hania-pass]

concurrency:
  group: hania360-home-staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOME_URL: https://hania360-home-staging.lior-hania.workers.dev
      PASS_URL: https://hania-pass-staging.lior-hania.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --check worker.js
      - name: Stop if the Cloudflare secrets are missing
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npx --yes wrangler@4 deploy --env staging
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do curl -fsS -o /tmp/home.html "$HOME_URL/" && break; sleep 5; done
          grep -q 'id="acct"' /tmp/home.html
          curl -sSI "$HOME_URL/" | grep -qi '^x-robots-tag: noindex'
          # Hania Pass staging answers this page's "who is signed in?" question.
          curl -fsS -D /tmp/h.txt -o /dev/null -H "Origin: $HOME_URL" "$PASS_URL/api/session"
          grep -qi "^access-control-allow-origin: $HOME_URL" /tmp/h.txt
          echo "Home staging is up and can ask Hania Pass who is signed in."
