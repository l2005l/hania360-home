name: probe-siddur
on: { push: { branches: [dat-siddur] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > t.mjs <<'X'
          const store = new Map();
          globalThis.caches = { default: { match: async (k) => store.has(k.url) ? new Response(store.get(k.url)) : undefined, put: async (k, r) => store.set(k.url, await r.text()) } };
          const { siddurApi } = await import("./shabbat/siddur.js");
          const call = async (q) => { const u = new URL("https://dat.hania360.com/api/siddur/" + q); return (await siddurApi(new Request(u), u)).json(); };
          for (const n of ["ashkenaz", "sefard", "mizrach"]) for (const p of ["shacharit", "mincha", "arvit"]) {
            const t = await call("toc?n=" + n + "&p=" + p);
            console.log("TOC", n, p, t.error || "", (t.sections || []).length, "hallel", (t.hallel || []).length, JSON.stringify((t.sections || []).slice(0, 3).map(s => s.he)), JSON.stringify((t.hallel||[]).slice(0,2)));
            if (p === "shacharit" && t.sections) { const am = t.sections.find(s => /עמידה|Amid/.test(s.he + s.ref)); const x = await call("text?n=" + n + "&ref=" + encodeURIComponent(am.ref)); console.log("TEXT", n, am.ref, (x.paras || []).length, JSON.stringify((x.paras || []).slice(0, 2)).slice(0, 300)); }
          }
          X
          node t.mjs
