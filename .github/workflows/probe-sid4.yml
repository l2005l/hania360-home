name: probe-sid4
on: { push: { branches: [probe-sid4] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          cat > s.mjs <<'X'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const n of ["ashkenaz", "sefard", "mizrach"]) for (const tab of [1, 2, 3]) {
            const c = await b.newContext({ viewport: { width: 400, height: 880 }, timezoneId: "Asia/Jerusalem" });
            await c.addInitScript((n) => localStorage.setItem("haniashabbat-v1", JSON.stringify({ city: "תל אביב", hav: "deg", before: 0, nusach: n })), n);
            const p = await c.newPage(); await p.goto("https://dat.hania360.com/"); await p.waitForTimeout(1200);
            await p.evaluate(() => document.getElementById("tefSid").click()); await p.waitForTimeout(300);
            await p.click("#sidAll"); await p.waitForTimeout(200); await p.click("#sidTabs button:nth-child(" + tab + ")"); await p.waitForTimeout(12000);
            const r = await p.evaluate(() => { const off = [...document.querySelectorAll("#sidBody p.off")].map(e => e.innerText.replace(/[֑-ׇ]/g, "").slice(0, 45)); const all = document.querySelectorAll("#sidBody p").length; const secOff = [...document.querySelectorAll("#sidBody .sidsec.off h3")].map(e => e.innerText); return { all, off: off.length, secOff, sample: off }; });
            console.log("R", n, tab, r.all, r.off, JSON.stringify(r.secOff), JSON.stringify(r.sample));
            await c.close();
          }
          await b.close();
          X
          node s.mjs
