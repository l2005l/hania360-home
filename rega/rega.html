<style>

.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{border:2px solid var(--line);background:#fff;border-radius:999px;min-height:52px;padding:8px 16px;font-weight:700}

/* modes */
html.big{--fs:23px}
body.big .tiles{grid-template-columns:1fr}body.big .feel{grid-template-columns:repeat(2,1fr)}html.big .top .brand>span:last-child{display:none}body.big .tools .ic{width:56px;height:56px}body.big .tile{min-height:104px;grid-template-columns:auto 1fr;align-items:center;align-content:center}body.big .tile .e{width:64px;height:64px;font-size:2rem}
body.big .tile small{font-size:.9rem;color:var(--ink2)}
body.big .card,body.big .tile{border-width:2px;border-color:#94A3B8}

body.night{--ink:#F5E9D7;--ink2:#CDBBA2;--ink3:#A8977F;--line:#3A3328;--bg:#14110D;--card:#1E1A14;--glow:none;background:#14110D}

body.night .btn{background:#4B3B23;color:#F5E9D7;box-shadow:none}body.night .btn.ghost,body.night .btn.soft{background:#2A241B;color:#F5E9D7;border-color:#4B3B23}
body.night .grad{background:none;color:#F5D7A1}body.night .back{background:linear-gradient(transparent,rgba(20,17,13,.96) 30%)}
body.night .help{background:#221D16;border-color:#4B3B23}body.night .bub.u{background:#2A241B}body.night .ball{filter:brightness(.6) sepia(.4)}
body.night .tile .e{background:#2A241B}body.night .mem button{background:#3A3328}body.night .mem button.open,body.night .mem button.done{background:#1E1A14}
@media(prefers-reduced-motion:reduce){.ball{transition:none}.mic.on{animation:none}.cele{animation:none}}
</style>
