<style>

.pill.on{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}

.tabs button{background:none;border:0;color:var(--muted);display:grid;justify-items:center;gap:2px;font-size:12.5px;padding:4px 10px;min-width:64px}
.tabs button b{font-size:21px;line-height:1}
.tabs button[aria-selected=true]{color:var(--pitch)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}

.mini{display:flex;align-items:center;gap:10px}

.cta{background:var(--pitch);color:var(--pitch-ink);border:0;border-radius:12px;padding:10px 14px;font:800 15px var(--display)}

.note{color:var(--muted);font-size:12.5px;text-align:center}
dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:20px;width:min(560px,94vw);padding:18px}

:focus-visible{outline:3px solid var(--pitch);outline-offset:2px}
</style>
