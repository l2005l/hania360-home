<title>Hania · העוזרת האישית</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Hania: a chat with the owner's assistant. Writing or speaking (the phone's own speech recognition, in Hebrew).
   Anything that changes Today shows as a card with "yes / cancel" first. The conversation stays on this phone. */
:root{--bg:#120F24;--surface:#1D1838;--surface2:#272049;--ink:#F3F0FF;--muted:#A9A3C9;--line:#342C5E;--me:#7C3AED;--accent:#F472B6;--ok:#34D399;--font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{direction:rtl;margin:0;font-family:var(--font);font-size:16px;line-height:1.55;color:var(--ink);background:radial-gradient(120% 60% at 50% 0%,#2A1B5C,var(--bg) 60%) fixed;display:flex;flex-direction:column}
a{color:#C4B5FD}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;max-width:820px;width:100%;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.logo img{width:36px;height:36px;border-radius:11px}
.logo small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);line-height:1.2}
.hb{display:flex;gap:6px;align-items:center}
select,.ib{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 9px}
.ib{cursor:pointer}
main{flex:1;overflow-y:auto;max-width:820px;width:100%;margin:0 auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.me{align-self:flex-start;background:var(--me);border-bottom-right-radius:6px}
.hania{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.used{display:block;margin-top:4px;font-size:11.5px;color:var(--muted)}
.typing{align-self:flex-end;color:var(--muted);font-size:14px;padding:4px 10px}
.typing i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.2;transform:translateY(-3px)}}
.confirm{align-self:flex-end;max-width:90%;background:var(--surface2);border:1.5px solid var(--accent);border-radius:18px;padding:12px 14px;display:grid;gap:10px}
.confirm b{font-size:15.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--ok);color:#06281C}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.hello{text-align:center;color:var(--muted);margin:auto 0;padding:20px 6px}
.hello .big{font-size:54px}.hello h1{color:var(--ink);font-size:24px;margin:6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chip{appearance:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
footer{max-width:820px;width:100%;margin:0 auto;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px}
textarea{flex:1;resize:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:9px 10px;max-height:140px;outline:none}
.round{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;font-size:20px;cursor:pointer;background:var(--surface2);color:var(--ink)}
.round.send{background:linear-gradient(135deg,var(--accent),var(--me));color:#fff}
.round.rec{background:#EF4444;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(239,68,68,.25)}}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:6px 0 0}
</style>
<header>
  <div class="logo"><img src="/icons/icon-192.png" alt=""><span>Hania<small>העוזרת האישית שלך</small></span></div>
  <div class="hb"><select id="city" aria-label="עיר"></select><button class="ib" id="clear" type="button" title="שיחה חדשה">🧹</button></div>
</header>
<main id="log" aria-live="polite"></main>
<footer>
  <div class="bar">
    <textarea id="t" rows="1" placeholder="מה תרצה לדעת או לעשות?" aria-label="הודעה"></textarea>
    <button class="round" id="mic" type="button" aria-label="דיבור" hidden>🎙️</button>
    <button class="round send" id="go" type="button" aria-label="שליחה">➤</button>
  </div>
  <p class="fine" id="usage"></p>
</footer>
<script>
(function () {
  "use strict";
  var CITIES = /*CITIES*/["ירושלים"];
  var S = (function () { try { return JSON.parse(localStorage.getItem("ai-v1")) || {}; } catch (e) { return {}; } })();
  if (!Array.isArray(S.log)) S.log = [];
  function save() { try { S.log = S.log.slice(-40); localStorage.setItem("ai-v1", JSON.stringify(S)); } catch (e) {} }
  function $(id) { return document.getElementById(id); }
  function el(t, a, kids) { var e = document.createElement(t); for (var k in a || {}) { if (k === "text") e.textContent = a[k]; else if (k === "onclick") e.addEventListener("click", a[k]); else e.setAttribute(k, a[k]); } (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }); return e; }
  var log = $("log"), busy = false;
  var NAMES = { day: "זמני היום", my_today: "Today", limud: "לימוד יומי", news: "חדשות", sport: "ספורט", tv: "HaniaTV", find_app: "מפת האפליקציות" };

  // Links in answers become clickable; everything else stays plain text.
  function rich(text) {
    var f = document.createDocumentFragment(), re = /https?:\/\/[^\s)]+/g, last = 0, m;
    while ((m = re.exec(text))) { f.appendChild(document.createTextNode(text.slice(last, m.index))); f.appendChild(el("a", { href: m[0], target: "_blank", rel: "noopener", text: m[0].replace(/^https:\/\//, "").replace(/\/$/, "") })); last = m.index + m[0].length; }
    f.appendChild(document.createTextNode(text.slice(last))); return f;
  }
  function bubble(m) {
    var b = el("div", { class: "msg " + (m.role === "user" ? "me" : "hania") });
    b.appendChild(rich(m.content));
    if (m.used && m.used.length) b.appendChild(el("span", { class: "used", text: "מתוך: " + m.used.map(function (u) { return NAMES[u] || u; }).join(" · ") }));
    return b;
  }
  function hello() {
    var chips = ["מה יש לי היום?", "מתי נכנסת שבת?", "מה הדף היומי היום?", "תזכירי לי מחר ב־8 להתקשר לרופא", "מה המצב בליגה?", "מה משדרים עכשיו?", "איפה יש אפליקציה למטלות של הילדים?"];
    return el("div", { class: "hello" }, [el("div", { class: "big", text: "✨" }), el("h1", { text: "שלום, אני Hania" }),
      el("p", { text: "אני מכירה את כל האפליקציות שלך: Today, שבת וזמני היום, הלימוד היומי, ספורט, חדשות ו־HaniaTV. אפשר לבקש ממני גם להוסיף משימות ותזכורות, ואני תמיד אשאל לפני." }),
      el("div", { class: "chips" }, chips.map(function (c) { return el("button", { class: "chip", type: "button", text: c, onclick: function () { send(c); } }); }))]);
  }
  function paint() {
    log.textContent = "";
    if (!S.log.length) { log.appendChild(hello()); return; }
    S.log.forEach(function (m) { log.appendChild(bubble(m)); });
    if (S.pending) log.appendChild(confirmCard(S.pending));
    log.scrollTop = log.scrollHeight;
  }
  function confirmCard(p) {
    return el("div", { class: "confirm" }, [el("b", { text: "לבצע? " + p.text }), el("div", { class: "row" }, [
      el("button", { class: "btn", type: "button", text: "✅ כן", onclick: function () { var x = S.pending; S.pending = null; save(); call({ confirm: { tool: x.tool, args: x.args } }); } }),
      el("button", { class: "btn ghost", type: "button", text: "ביטול", onclick: function () { S.pending = null; S.log.push({ role: "assistant", content: "בסדר, ביטלתי." }); save(); paint(); } })])]);
  }
  function call(extra) {
    busy = true; paint();
    var ty = el("div", { class: "typing" }, [el("i"), el("i"), el("i")]); log.appendChild(ty); log.scrollTop = log.scrollHeight;
    var body = Object.assign({ city: S.city || "", messages: S.log.filter(function (m) { return !m.local; }).slice(-8).map(function (m) { return { role: m.role, content: m.content }; }) }, extra || {});
    fetch("/api/ai/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { if (r.status === 404) throw new Error("auth"); return r.json(); })
      .then(function (j) {
        if (j.answer) S.log.push({ role: "assistant", content: j.answer, used: j.used || [] });
        S.pending = j.pending || null;
      })
      .catch(function (e) { S.log.push({ role: "assistant", content: e.message === "auth" ? "צריך להתחבר עם החשבון שלך ב־Hania Pass: https://pass.hania360.com/" : "אין חיבור כרגע. ננסה שוב?", local: true }); })
      .then(function () { busy = false; save(); paint(); usage(); });
  }
  function send(text) {
    text = String(text || "").trim(); if (!text || busy) return;
    if (S.pending) { S.pending = null; }
    S.log.push({ role: "user", content: text }); save();
    $("t").value = ""; grow(); call();
  }
  function grow() { var t = $("t"); t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; }
  function usage() { fetch("/api/ai/usage").then(function (r) { return r.json(); }).then(function (j) { $("usage").textContent = j.cap ? "היום: " + j.today + " מתוך " + j.cap + " שאלות" : ""; }).catch(function () {}); }

  $("go").addEventListener("click", function () { send($("t").value); });
  $("t").addEventListener("input", grow);
  $("t").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("t").value); } });
  $("clear").addEventListener("click", function () { if (!S.log.length || confirm("להתחיל שיחה חדשה?")) { S.log = []; S.pending = null; save(); paint(); } });
  var cs = $("city"); CITIES.forEach(function (c) { var o = el("option", { value: c, text: c }); if (c === (S.city || CITIES[0])) o.selected = true; cs.appendChild(o); });
  cs.addEventListener("change", function () { S.city = cs.value; save(); });

  // Speaking: the phone's own recognition (free, nothing sent to us but the text).
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    var mic = $("mic"), rec = null; mic.hidden = false;
    mic.addEventListener("click", function () {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = "he-IL"; rec.interimResults = true; rec.continuous = false;
      mic.classList.add("rec");
      rec.onresult = function (e) { var s = ""; for (var i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; $("t").value = s; grow(); if (e.results[e.results.length - 1].isFinal) { var t = s; setTimeout(function () { send(t); }, 250); } };
      rec.onend = rec.onerror = function () { mic.classList.remove("rec"); rec = null; };
      try { rec.start(); } catch (x) { mic.classList.remove("rec"); rec = null; }
    });
  }
  paint(); usage();
})();
</script>
