<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>הוספה ליומן · לו״ז הצוות</title><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#2152D9"><link rel="icon" href="/icons/icon-192.png">

<style>
:root{--board:#FBFCFD;--paper:#fff;--ink:#18233A;--soft:#55617A;--line:#E1E6EE;--marker:#2152D9;--marker-soft:#E8EEFC}
@media (prefers-color-scheme:dark){:root{--board:#0F1522;--paper:#171F30;--ink:#E6EBF5;--soft:#9AA6BE;--line:#26304A;--marker:#7EA2FF;--marker-soft:#1E2A4A;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--board);color:var(--ink);font:16px/1.5 "IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px 16px}
main{width:min(440px,100%)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px 20px;border-top:6px solid var(--marker)}
.when{font:700 52px/.95 "Karantina","IBM Plex Sans Hebrew",sans-serif;direction:ltr;text-align:right}
.day{color:var(--soft);margin:6px 0 14px}
h1{font-size:22px;margin:0 0 6px;line-height:1.3}
.m{color:var(--soft);margin:2px 0}
.go{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:16px;padding:14px;font-weight:700;font-size:17px;margin-top:12px;min-height:54px}
.go.a{background:var(--marker);color:#fff}.go.b{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.n{color:var(--soft);font-size:13px;text-align:center;margin-top:16px}
.n a{color:inherit}
</style></head><body><main>
<div class="card" id="card" hidden>
<div class="when" id="w"></div><div class="day" id="d"></div>
<h1 id="t"></h1><p class="m" id="p" hidden></p><p class="m" id="n" hidden></p><p class="m" id="r" hidden></p>
<div id="btns"></div>
</div>
<div class="card" id="bad" hidden><h1>הקישור לא שלם</h1><p class="m">כנראה שחלק ממנו נחתך בהעתקה. אפשר לבקש מהמנהל לשלוח אותו שוב.</p></div>
<p class="n">לו״ז הצוות · <a href="/">loz.hania360.com</a><br>פרטי האירוע עוברים רק כדי ליצור את קובץ היומן, ולא נשמרים.</p>
</main>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)},raw=(location.hash||"").slice(1),o=null;
try{var s=raw.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);o=JSON.parse(new TextDecoder().decode(a));
  if(!o||!/^\d{4}-\d{2}-\d{2}$/.test(o.d)||!/^\d{2}:\d{2}$/.test(o.s)||!/^\d{2}:\d{2}$/.test(o.e)||!o.t)throw 0}catch(e){o=null}

var ics="/c.ics?e="+encodeURIComponent(raw),ua=navigator.userAgent||"",ios=/iphone|ipad|ipod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),android=/android/i.test(ua);
var A='<a class="go a" href="'+(android?g:ics)+'"'+(android?' target="_blank" rel="noopener"':"")+'>📅 '+(android?"הוספה ליומן Google":"הוספה ליומן")+'</a>',B='<a class="go b" href="'+(android?ics:g)+'"'+(android?"":' target="_blank" rel="noopener"')+'>'+(android?"ליומן אחר (קובץ יומן)":"ליומן Google")+'</a>';
