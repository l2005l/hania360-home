<style>

.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}

.btn{appearance:none;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:17px;padding:12px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}

.btn:focus-visible,button:focus-visible{outline:3px solid var(--c2);outline-offset:2px}

.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

@media print{

  .sheet .ans.page{break-before:page}
  .sheet .q[contenteditable]:focus{background:none}
}
@media (prefers-reduced-motion:reduce){.timer.end b{animation:none}}
</style>
