<style>
/* Layout: a night sky. Choose (who, where, with whom, what about) on cards; the story opens as a big, calm page
   that the phone reads aloud, one sentence lit at a time. */
:root{
  --sky:#141335; --sky2:#221E52; --card:#2B2763; --card2:#363178; --ink:#F4F1FF; --muted:#B9B3E6; --moon:#FFE7A3; --pink:#FF9EC7; --mint:#8EF0D0; --line:#463F96;

}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);line-height:1.5;background:radial-gradient(120% 70% at 80% 0%,#3A2F86 0%,var(--sky2) 35%,var(--sky) 75%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 20%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 30% 8%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 15%,#fffa 50%,transparent 51%),radial-gradient(1px 1px at 88% 30%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 52% 40%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 18% 62%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 80% 70%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 40% 85%,#fff5 50%,transparent 51%)}
.wrap{position:relative;max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
header{display:flex;align-items:center;gap:10px}
header b{font-family:var(--title);font-size:22px;font-weight:400}header b span{color:var(--moon)}
header a{margin-inline-start:auto;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.moon{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF6D6,var(--moon) 60%,#E9C873);box-shadow:0 0 40px #FFE7A366;position:relative}
.moon::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#E9C87366;top:36px;left:16px}
.hero h1{margin:0;font-family:var(--title);font-weight:400;font-size:clamp(26px,7vw,36px);line-height:1.15;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--muted);font-size:15.5px}
h2{margin:0;font-size:17px;font-weight:800;color:var(--moon)}
.box{background:#ffffff0d;border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:12px}
.kids{display:flex;gap:8px;flex-wrap:wrap}
.kids button{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 16px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.kids button[aria-pressed="true"]{border-color:var(--moon);background:var(--moon);color:#2B2240}
.kids .add{border-style:dashed;background:transparent;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.opt{appearance:none;border:2px solid transparent;background:var(--card);color:var(--ink);border-radius:18px;padding:10px 4px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:grid;gap:4px;justify-items:center;text-align:center;line-height:1.25}
.opt i{font-style:normal;font-size:28px;line-height:1}
.opt[aria-pressed="true"]{border-color:var(--moon);background:var(--card2);box-shadow:0 0 18px #FFE7A333}
.vals{display:flex;gap:8px;flex-wrap:wrap}
.vals button{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 12px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.vals button[aria-pressed="true"]{border-color:var(--mint);background:#8EF0D022}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
input,select{font:inherit;font-size:17px;color:var(--ink);background:var(--sky);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:3px solid var(--moon);outline-offset:1px}
.btn{appearance:none;border:0;border-radius:999px;background:var(--moon);color:#2B2240;font:inherit;font-weight:800;font-size:19px;padding:15px 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 30px #FFE7A344}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;font-size:15.5px;padding:10px 16px}
.btn:disabled{opacity:.55;cursor:default}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.go{display:grid;grid-template-columns:1fr auto;gap:8px}
.note{margin:0;color:var(--muted);font-size:14px}
/* writing */
.writing{display:grid;justify-items:center;gap:14px;padding:40px 10px;text-align:center}
.writing .moon{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
/* reading */
.page{background:#FFFBF0;color:#2E2A4F;border-radius:26px;padding:24px 20px;display:grid;gap:14px;box-shadow:0 20px 60px #0008}
.page h1{margin:0;font-family:var(--title);font-weight:400;font-size:clamp(26px,7vw,34px);line-height:1.2;color:#3A2F86;text-align:center;text-wrap:balance}
.page p{margin:0;font-size:clamp(19px,5vw,22px);line-height:1.85}
.page .s{border-radius:6px;transition:background .25s}
.page .s.on{background:#FFE7A3;box-shadow:0 0 0 3px #FFE7A3}
body.dim .page{background:#1B1838;color:#CFC8F5}body.dim .page h1{color:var(--moon)}body.dim .page .s.on{background:#3A2F86;box-shadow:0 0 0 3px #3A2F86}
.player{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;background:#141335ee;border:1px solid var(--line);border-radius:22px;padding:10px;backdrop-filter:blur(8px)}
.player .big{width:62px;height:62px;border-radius:50%;padding:0;font-size:26px}
.player .btn.ghost{padding:9px 12px;font-size:15px}
.lib{display:grid;gap:8px}
.lib button{appearance:none;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 12px;font:inherit;cursor:pointer}
.lib b{font-size:16px}.lib small{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--moon);color:#2B2240;padding:10px 16px;border-radius:12px;font-weight:800;z-index:40;max-width:90%}
@media (prefers-reduced-motion:reduce){.writing .moon{animation:none}}
</style>
