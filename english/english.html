<title>HaniaEnglish · אנגלית לילדים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a path of islands, one unit each, from the ABC up to short sentences. A lesson is one question per screen,
   big pictures and big buttons; every English word can be heard. The child grows along the path. */
:root{
  --bg:#EFFBF6; --surface:#FFFFFF; --ink:#16322B; --muted:#5E7A72; --line:#D3EFE4; --main:#14B37D; --main2:#0E8F63; --sky:#3BA3FF; --sun:#FFC233; --bad:#F2545B; --ok2:#DDF7EC; --bad2:#FDE7E8;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif; --en:"Fredoka","Rubik",system-ui,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#0F1F1B;--surface:#16302A;--ink:#EAFBF4;--muted:#9EC2B6;--line:#24453C;--ok2:#14392D;--bad2:#3C1E21;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{direction:rtl;margin:0;font-family:var(--font);font-size:17px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:620px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px}
.logo{font-weight:900;font-size:24px;display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}.logo b{color:var(--main)}
.logo img{width:32px;height:32px;border-radius:9px}
header .sp{margin-inline-start:auto}
h1{font-weight:900;font-size:clamp(26px,7vw,36px);line-height:1.15;margin:0}
h2{font-weight:800;font-size:20px;margin:0}
p{margin:0}
.lead{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr);box-shadow:0 3px 0 var(--line)}
.btn{appearance:none;border:0;border-radius:18px;padding:14px 18px;font:inherit;font-weight:800;font-size:19px;cursor:pointer;background:var(--main);color:#fff;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 var(--main2)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--main2)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}
.btn.small{padding:9px 13px;font-size:15.5px;border-radius:12px;box-shadow:0 3px 0 var(--main2)}
.btn.ghost.small{box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:9px 14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--main);color:#fff;border-color:var(--main)}
input{font:inherit;font-size:18px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;width:100%}
.fine{font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:80;max-width:90vw;text-align:center}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
/* kids */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kidb{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:14px 10px;font:inherit;cursor:pointer;display:grid;gap:4px;justify-items:center;box-shadow:0 4px 0 var(--line)}
.kidb .av{font-size:44px;line-height:1}.kidb b{font-size:18px}.kidb span{font-size:13px;color:var(--muted)}
/* the path */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:800;font-size:15px}
.path{display:grid;gap:14px;padding:6px 0}
.isl{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;appearance:none;border:0;background:transparent;color:inherit;font:inherit;text-align:start;cursor:pointer;padding:0}
.isl:nth-child(4n+2){margin-inline-start:28px}.isl:nth-child(4n+3){margin-inline-start:56px}.isl:nth-child(4n+4){margin-inline-start:28px}
.isl .ic{width:76px;height:76px;border-radius:50%;display:grid;place-content:center;font-size:36px;background:var(--surface);border:4px solid var(--line);box-shadow:0 6px 0 var(--line);position:relative}
.isl.open .ic{border-color:var(--main);box-shadow:0 6px 0 var(--main2)}
.isl.done .ic{background:var(--main);border-color:var(--main);box-shadow:0 6px 0 var(--main2)}
.isl.lock{cursor:default}.isl.lock .ic{filter:grayscale(1);opacity:.55}
.isl.next .ic{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.isl b{font-size:18px;display:block}.isl small{color:var(--muted);font-size:14px}
.stars{font-size:14px;letter-spacing:1px}
/* a lesson */
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .3s}
.q{display:grid;gap:14px;justify-items:center;text-align:center}
.q .ask{font-size:20px;font-weight:800}
.big{font-size:min(30vw,130px);line-height:1.05}
.word{font-family:var(--en);font-size:clamp(40px,12vw,64px);font-weight:700;direction:ltr;line-height:1.1}
.say{appearance:none;border:0;border-radius:22px;background:var(--sky);color:#fff;font-size:44px;width:110px;height:110px;cursor:pointer;box-shadow:0 6px 0 #1F7FD6}
.say.sm{width:56px;height:56px;font-size:24px;border-radius:16px;box-shadow:0 4px 0 #1F7FD6}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.opt{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;min-height:96px;padding:10px;font:inherit;font-size:44px;cursor:pointer;box-shadow:0 5px 0 var(--line);display:grid;place-content:center;gap:2px}
.opt.t{font-family:var(--en);font-size:clamp(22px,6vw,30px);font-weight:600;direction:ltr}
.opt.ok{border-color:var(--main);background:var(--ok2);box-shadow:0 5px 0 var(--main)}
.opt.no{border-color:var(--bad);background:var(--bad2);box-shadow:0 5px 0 var(--bad)}
.opt:disabled{cursor:default}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:ltr;min-height:60px}
.tile{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;min-width:52px;padding:8px 12px;font-family:var(--en);font-size:26px;font-weight:600;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.tile.used{visibility:hidden}
.built{border-bottom:3px dashed var(--line);width:100%;padding-bottom:8px}
.fb{width:100%;border-radius:18px;padding:12px 14px;font-weight:800;font-size:18px;display:grid;gap:8px}
.fb.ok{background:var(--ok2);color:var(--main2)}.fb.no{background:var(--bad2);color:#B4232A}
@media (prefers-color-scheme:dark){.fb.ok{color:#7FE8BF}.fb.no{color:#FF9EA3}}
.learn{display:grid;gap:10px;justify-items:center;text-align:center}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mt .opt{min-height:74px;font-size:38px}.mt .opt.t{font-size:24px}
.mt .opt.sel{border-color:var(--sky);box-shadow:0 5px 0 var(--sky)}
.mt .opt.gone{visibility:hidden}
.res{text-align:center;justify-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
