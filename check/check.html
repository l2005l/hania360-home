<title>HaniaCheck · בודקים לפני שמשלמים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap">
<style>
/* Layout: a yellow Israeli plate as the search box; under it a verdict strip, then cards of facts. */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#12233D; --muted:#5D6B80; --line:#DCE3EC;
  --plate:#FFD21F; --plate-ink:#111; --il:#1F4FB8; --ok:#11845B; --ok-bg:#E3F5EC; --warn:#B5590B; --warn-bg:#FFF1E0; --bad:#C62D3A; --bad-bg:#FDE7E9;
  --font:"Heebo",system-ui,-apple-system,"Segoe UI","Arial Hebrew",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#0C1524;--surface:#152238;--ink:#E8EEF7;--muted:#98A6BB;--line:#26354F;--ok:#4FD39B;--ok-bg:#12332A;--warn:#FFB36B;--warn-bg:#3A2A14;--bad:#FF7A85;--bad-bg:#3B1B22;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
header{display:flex;align-items:center;gap:10px}
header b{font-size:21px;font-weight:900;letter-spacing:-.01em}
header a{margin-inline-start:auto;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
h1{margin:6px 0 0;font-size:clamp(26px,7vw,36px);line-height:1.15;font-weight:900;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:16.5px}
/* the plate */
form.plate{display:flex;direction:ltr;align-items:stretch;background:var(--plate);border:3px solid #111;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(18,35,61,.18);height:84px}
.il{width:44px;flex:none;background:var(--il);color:#fff;display:grid;place-items:center;align-content:center;gap:2px;font:800 13px/1 var(--font);padding:6px 0}
.il i{font-style:normal;font-size:16px}
.plate input{flex:1;min-width:0;border:0;background:transparent;font:900 clamp(34px,10vw,48px)/1 "Heebo",sans-serif;letter-spacing:.04em;text-align:center;color:var(--plate-ink);font-variant-numeric:tabular-nums;outline:none}
.plate input::placeholder{color:rgba(0,0,0,.2)}
.plate button{appearance:none;border:0;border-left:3px solid #111;background:#111;color:var(--plate);font:800 18px var(--font);padding:0 18px;cursor:pointer}
.plate:focus-within{outline:3px solid var(--il);outline-offset:3px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip input{display:none}
.chip small{color:var(--muted);font-weight:400}
.recent{display:flex;gap:6px;flex-wrap:wrap}
.recent button{appearance:none;border:1.5px solid #111;background:var(--plate);color:#111;border-radius:6px;padding:3px 9px;font:800 14px var(--font);direction:ltr;cursor:pointer}
.status{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
/* result */
.car{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:6px}
.car h2{margin:0;font-size:clamp(22px,6vw,28px);line-height:1.2;font-weight:900;text-wrap:balance}
.car .sub{color:var(--muted);font-size:15.5px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-inline-end:5px}
.flags{display:grid;gap:8px}
.flag{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;padding:12px 14px;border-radius:14px;font-size:15.5px}
.flag b{font-weight:800}
.flag span:first-child{font-size:20px;line-height:1.2;grid-row:span 2}
.flag small{color:inherit;opacity:.85}
.flag.ok{background:var(--ok-bg);color:var(--ok)}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.flag.bad{background:var(--bad-bg);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.stat b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.25}
.stat i{font-style:normal;color:var(--muted);font-size:13px}
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
summary{cursor:pointer;font-weight:800;padding:10px 0;font-size:16px}
dl{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 14px;margin:0 0 12px;font-size:15px}
dt{color:var(--muted)}
dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.hands{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.hands li{display:flex;gap:10px;align-items:center;font-size:15px}
.hands li b{min-width:64px;font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{appearance:none;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;font-size:16px;padding:13px;cursor:pointer;text-align:center;text-decoration:none}
.btn.wa{background:#1FA855;color:#fff}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--il);outline-offset:2px}
.src{color:var(--muted);font-size:13px;margin:0}
.src a{color:inherit}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 12px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px}
.cats button i{font-style:normal;font-size:22px;line-height:1}
.cats button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
form.search{display:flex;gap:8px}
form.search input{flex:1;min-width:0;font:inherit;font-size:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px 14px}
form.search input:focus{outline:3px solid var(--il);outline-offset:1px}
form.search button{appearance:none;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;font-size:17px;padding:0 18px;cursor:pointer}
.hint{margin:0;color:var(--muted);font-size:14.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 13px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--il);border-color:var(--il);color:#fff}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:6px}
.rec h3{margin:0;font-size:19px;line-height:1.3;font-weight:800;overflow-wrap:anywhere}
.rec .sub{color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:13px;font-weight:800;border-radius:8px;padding:2px 9px;background:var(--bg);color:var(--ink)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.rec details{border:0;padding:0;background:transparent}
.rec summary{padding:4px 0;font-size:14.5px;color:var(--il)}
.group{margin:6px 0 0;font-size:15px;color:var(--muted);font-weight:800}
.fund{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.fund.me{border:2px solid var(--il)}
.fund .rk{font-weight:900;font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums;grid-row:span 2}
.fund b{font-size:15.5px;overflow-wrap:anywhere}
.fund .y{font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;text-align:left;direction:ltr}
.fund small{color:var(--muted);font-size:13px}
.fund .f{font-size:13px;color:var(--muted);text-align:left}
.deal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.deal:first-child{border-top:0}
.deal b{font-size:16px}.deal .pr{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.deal small{color:var(--muted);font-size:13.5px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;max-width:90%}
</style>

<div class="wrap">
  <header><b>Hania<span style="color:var(--il)">Check</span></b><a href="https://hania360.com/">Hania360 ←</a></header>
  <div>
    <h1>בודקים לפני שמשלמים</h1>
    <p class="lead">רכב, חברה, קבלן, מתווך, עמותה, מוסך, קרן פנסיה ומחירי דירות. הכל ממאגרי המידע הרשמיים של המדינה, בחינם.</p>
  </div>
  <nav class="cats" id="cats" aria-label="מה בודקים"></nav>
  <section class="panel" id="p-car">
    <form class="plate" id="form" autocomplete="off">
      <div class="il" aria-hidden="true"><i>🇮🇱</i>IL</div>
      <input id="num" inputmode="numeric" placeholder="12-345-67" aria-label="מספר הרכב" maxlength="10">
      <button type="submit">בדיקה</button>
    </form>
    <div class="tools">
      <label class="chip" id="photoBtn"><input type="file" accept="image/*" capture="environment" id="photo">📷 צילום לוחית <small>ניסיוני</small></label>
      <div class="recent" id="recent"></div>
    </div>
  </section>
  <section class="panel" id="p-text" hidden>
    <form class="search" id="qForm" autocomplete="off">
      <input id="qIn" type="search" enterkeyhint="search" aria-label="חיפוש">
      <button type="submit">חיפוש</button>
    </form>
    <p class="hint" id="qHint"></p>
  </section>
  <section class="panel" id="p-pension" hidden>
    <div class="seg" id="penType" role="radiogroup" aria-label="סוג הקרן"></div>
    <form class="search" id="penForm" autocomplete="off">
      <input id="penIn" type="search" placeholder="שם הקרן או החברה, למשל מגדל או אלטשולר" aria-label="שם הקרן">
      <button type="submit">השוואה</button>
    </form>
  </section>
  <section class="panel" id="p-nadlan" hidden>
    <form class="search" id="ndForm" autocomplete="off">
      <input id="ndIn" type="search" placeholder="רחוב, מספר ועיר, למשל הרצל 10 נתיבות" aria-label="כתובת">
      <button type="submit">מחירים</button>
    </form>
    <div class="seg" id="ndRooms" role="radiogroup" aria-label="מספר חדרים"></div>
  </section>
  <div class="status" id="status" hidden></div>
  <div id="out" class="wrap" style="padding:0;gap:12px;width:100%" hidden></div>
  <p class="src" id="src"></p>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function el(t, a, kids) { var e = document.createElement(t); Object.keys(a || {}).forEach(function (k) { if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), a[k]); else if (k === "text") e.textContent = a[k]; else e.setAttribute(k, a[k]); }); (kids || []).forEach(function (c) { if (c != null && c !== false) e.append(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c); }); return e; }

  // Ministry of Transport open datasets (data.gov.il, CKAN). Filter keys differ between them.
  var R = {
    active: ["053cea08-09bc-40ec-8f7a-156f0677aff3", "mispar_rechev"],

    owners: ["bb2355dc-9ec7-4f06-9c3f-3344672171da", "mispar_rechev"],
    recall: ["36bf1404-0be4-49d2-82dc-2f1ead4a8b93", "MISPAR_RECHEV"],
    tag: ["c8b9f9c8-4612-4068-934f-d4acd2e3c06e", "MISPAR RECHEV"],
    moto: ["bf9df4e2-d90d-4c0a-a400-19e15af8e95f", "mispar_rechev"],
    heavy: ["cd3acc5c-03c3-4c89-9c54-d40f93c0d790", "mispar_rechev"],
    personal: ["03adc637-b6fe-402b-9937-7c3d3afc9140", "mispar_rechev"],
    inactive: ["f6efe89a-fb3d-43a4-bb61-9bf12a9b9099", "mispar_rechev"],

  };
  var CKAN = "https://data.gov.il/api/3/action/datastore_search";
  // Straight from the phone (the API allows it); through our server when the phone cannot reach it.

    return get(CKAN + "?" + q).catch(function () { return get("/api/plate?" + q); });
  }
  function byPlate(key, n, extra) { var f = {}; f[R[key][1]] = n; return ds(key, f, extra); }

  // ---- input ------------------------------------------------------------------------
  var digits = function (s) { return String(s || "").replace(/\D/g, ""); };
  function fmtPlate(d) { if (d.length === 7) return d.slice(0, 2) + "-" + d.slice(2, 5) + "-" + d.slice(5); if (d.length === 8) return d.slice(0, 3) + "-" + d.slice(3, 5) + "-" + d.slice(5); return d; }

  $("form").addEventListener("submit", function (e) { e.preventDefault(); go(digits($("num").value)); });

  // ---- dates & numbers ----------------------------------------------------------------
  var MONTHS = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
  function day(v) { var m = String(v || "").match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function fmtDay(d) { return d ? d.getDate() + "." + (d.getMonth() + 1) + "." + d.getFullYear() : "—"; }
  function ym(v) { var s = String(v || ""), m = s.match(/^(\d{4})-?(\d{1,2})/); return m ? { y: +m[1], m: +m[2] } : null; }

  var num = function (n) { return Number(n).toLocaleString("he-IL"); };
  function daysTo(d) { var t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d - t) / 864e5); }
  var COLORS = { "לבן": "#fff", "שחור": "#111", "כסף": "#C0C4CA", "כסוף": "#C0C4CA", "אפור": "#8A8F96", "כחול": "#2350B8", "אדום": "#C8222C", "ירוק": "#227A3A", "צהוב": "#F2C516", "חום": "#6B4A2B", "בז": "#D8C39A", "זהב": "#C9A646", "כתום": "#E9771E", "סגול": "#6B3FA0", "תכלת": "#7FC4EA", "בורדו": "#6D1B2A" };
  function colorDot(name) { var k = Object.keys(COLORS).filter(function (c) { return String(name || "").indexOf(c) >= 0; })[0]; return k ? el("span", { class: "dot", style: "background:" + COLORS[k] }) : null; }

  // ---- lookup ---------------------------------------------------------------------------
  var busy = false;
  function go(d) {
    if (d.length < 5 || d.length > 8) { toast("מספר רכב הוא 5 עד 8 ספרות"); return; }
    if (busy) return; busy = true;
    var n = +d;
    history.replaceState(null, "", "#car-" + d);
    $("out").hidden = true; status("בודקים במשרד התחבורה…");
    Promise.all([byPlate("active", n), byPlate("km", n).catch(no), byPlate("owners", n, { sort: "baalut_dt desc" }).catch(no), byPlate("recall", n).catch(no), byPlate("tag", n).catch(no)])
      .then(function (r) {
        if (r[0].length) return { car: r[0][0], kind: "", km: r[1][0], owners: r[2], recalls: r[3], tag: r[4][0] };
        // Not in the main registry: a motorbike, a truck, a personal import, or off the road.
        var other = [["moto", "דו־גלגלי"], ["heavy", "רכב כבד"], ["personal", "יבוא אישי"], ["inactive", "לא פעיל"], ["cancelled", "ירד מהכביש"]];
        return Promise.all(other.map(function (o) { return byPlate(o[0], n).catch(no); })).then(function (x) {

        });
      })
      .then(function (res) {
        busy = false;
        if (!res) { status("לא מצאנו רכב עם המספר " + fmtPlate(d) + " במאגרי משרד התחבורה. בודקים שהספרות נכונות."); return; }
        remember(d, res.car);
        var c = res.car;
        // Specs of the model (horsepower, airbags, gearbox) from the WLTP table, when the codes are there.
        var f = { tozeret_cd: c.tozeret_cd, degem_cd: c.degem_cd }; if (c.shnat_yitzur) f.shnat_yitzur = c.shnat_yitzur;

  function status(t) { $("status").hidden = !t; $("status").textContent = t; }

  // ---- result ---------------------------------------------------------------------------
  var BAALUT = { "פרטי": "פרטי", "ליסינג": "ליסינג", "השכרה": "השכרה", "חברה": "חברה", "סוחר": "סוחר", "ממשלתי": "ממשלתי" };
  function show(d, r) {
    var c = r.car, km = r.km || {}, out = $("out"), flags = [], now = new Date();
    var title = [c.tozeret_nm, c.kinuy_mishari || c.degem_nm].filter(Boolean).join(" ").replace(/\s+/g, " ").trim() || "רכב " + fmtPlate(d);
    var onRoad = ym(c.moed_aliya_lakvish), year = +c.shnat_yitzur || (onRoad && onRoad.y);
    var ageY = onRoad ? Math.max(0.25, (now.getFullYear() - onRoad.y) + (now.getMonth() + 1 - onRoad.m) / 12) : (year ? Math.max(0.25, now.getFullYear() - year + 0.5) : 0);
    var owners = (r.owners || []).slice().sort(function (a, b) { return (+a.baalut_dt || 0) - (+b.baalut_dt || 0); });

    // License and test

      })).then(function (xs) {

  function pct(v) { var n = parseFloat(v); return isFinite(n) ? (n > 0 ? "+" : "") + n.toFixed(2) + "%" : "—"; }

  }

  // ---- apartments: what sold around an address ---------------------------------------------------
  var rooms = "all";
  $("ndRooms").replaceChildren.apply($("ndRooms"), [["all", "כל הדירות"], ["3", "3 חדרים"], ["4", "4 חדרים"], ["5", "5+"]].map(function (o) { return el("button", { type: "button", role: "radio", "aria-checked": String(o[0] === rooms), onclick: function (e) { rooms = o[0]; Array.prototype.forEach.call($("ndRooms").children, function (b) { b.setAttribute("aria-checked", String(b === e.currentTarget)); }); if (lastDeals) showDeals(lastDeals); } }, [o[1]]); }));

  }
