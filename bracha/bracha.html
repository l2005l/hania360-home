:root[data-theme="dark"]{--bg:#17132A;--surface:#221C3D;--ink:#F3EEFF;--muted:#B5ACD6;--line:#352C5C}
*{box-sizing:border-box}[hidden]{display:none!important}

.wrap{max-width:600px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px}.logo{font-weight:900;font-size:22px;color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px}.logo b{color:var(--main)}.logo img{width:30px;height:30px;border-radius:9px}
header .sp{margin-inline-start:auto}.stars{font-weight:800;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px}
body.inhub header .logo{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:grid;gap:12px;box-shadow:0 16px 34px -26px rgba(42,33,64,.55)}
h1{margin:0;font-size:clamp(26px,7.5vw,36px);line-height:1.15}h2{margin:0;font-size:20px}
.lead{margin:0;color:var(--muted)}.fine{font-size:13px;color:var(--muted)}
.levels{display:grid;gap:10px}
.lvl{display:flex;gap:12px;align-items:center;text-align:start;appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;cursor:pointer;font:inherit;color:inherit}
.lvl .e{font-size:38px}.lvl b{display:block;font-size:18px}.lvl .st{margin-inline-start:auto;font-size:18px;letter-spacing:2px}
.btn{appearance:none;border:0;border-radius:16px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--main);color:#fff;box-shadow:0 4px 0 var(--main2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--surface);color:var(--main);border:1.5px solid var(--line);box-shadow:none}.btn.small{padding:8px 13px;font-size:14px;border-radius:12px}
.food{font-size:96px;text-align:center;line-height:1.1}
.ask{text-align:center;font-size:22px;font-weight:800;margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 8px;font:inherit;cursor:pointer;color:var(--ink);display:grid;gap:2px;justify-items:center;box-shadow:0 4px 0 var(--line)}
.opt .i{font-size:34px}.opt b{font-size:17px}.opt small{color:var(--muted);font-size:12.5px;line-height:1.3}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface));box-shadow:0 4px 0 var(--ok)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));opacity:.8}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:12px 14px;font-weight:700;display:grid;gap:6px}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}.fb.no{background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.fb .bl{font-weight:800;color:var(--main)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--main),var(--sun))}
.say{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer;margin:0 auto;display:block}
.big{font-size:64px;text-align:center}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (max-width:360px){.opt .i{font-size:28px}.food{font-size:80px}}
</style>
