        el("button", { class: "btn ghost small", type: "button", text: "📋 להעתיק", onclick: function () { try { navigator.clipboard.writeText(text).then(function () { toast("הועתק. אפשר להדביק ב־HaniaCart"); }); } catch (e) { prompt("הרשימה:", text); } } }),
        el("button", { class: "btn ghost small", type: "button", text: "🖨️ להדפיס", onclick: function () { print(); } })])]);
  }
  function settings() {
    var opt = function (on, t, fn) { return el("button", { class: "chip", type: "button", "aria-pressed": String(on), text: t, onclick: fn }); };
    var k = CUR, likes = Object.keys(k.like), nos = Object.keys(k.no);
    return el("details", { class: "card noprint" }, [el("summary", { style: "font-weight:800;cursor:pointer", text: "⚙️ הגדרות" }),
      el("div", { class: "row" }, [opt(S.nut, "🥜🚫 בלי אגוזים ובוטנים", function () { S.nut = !S.nut; save(); home(); }), opt(S.fri, "גם ביום שישי", function () { S.fri = !S.fri; save(); home(); })]),
      el("p", { class: "fine", text: "בגנים ובבתי ספר רבים אסור להביא אגוזים ובוטנים, ולכן זה דלוק מראש. בשרי וחלבי לא נכנסים יחד לאותה קופסה במילוי האוטומטי." }),
      likes.length || nos.length ? el("p", { class: "fine", text: (likes.length ? "❤️ " + k.name + " אוהב/ת: " + likes.join(", ") + ". " : "") + (nos.length ? "🚫 לא אוכל/ת: " + nos.join(", ") + "." : "") }) : el("p", { class: "fine", text: "בכל משבצת אפשר לסמן ❤️ מה הילד אוהב ו־🚫 מה הוא לא אוכל, והמילוי יתחשב בזה." }),
      !HUB && S.kids.length > 1 ? el("button", { class: "btn ghost small", type: "button", text: "להסיר את " + k.name, onclick: function () { if (!confirm("להסיר את " + k.name + "?")) return; S.kids = S.kids.filter(function (x) { return x !== k; }); CUR = S.kids[0]; save(); home(); } }) : null,
      !HUB ? el("button", { class: "btn ghost small", type: "button", text: "✏️ לשנות שם ל" + k.name, onclick: function () { var n = prompt("שם:", k.name); if (n && n.trim()) { k.name = n.trim().slice(0, 20); save(); home(); } } }) : null]);
  }
  // keep two months
  (function () { var cut = ymd(new Date(Date.now() - 60 * 864e5)); Object.keys(S.week).forEach(function (d) { if (d < cut) delete S.week[d]; }); save(); })();
  home();
})();
</script>
