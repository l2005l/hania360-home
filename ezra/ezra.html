<title>HaniaEzra · עזרה ראשונה</title>
<style>
/* Layout: one screen for the worst moment. The call button is always at the top; a big grid of situations;
   each opens as large numbered steps that can be read aloud. CPR and choking have their own live helpers. */
:root{
  --bg:#FFF7F6; --surface:#FFFFFF; --ink:#1E1A1D; --muted:#6B5F64; --line:#F0D9DA; --red:#D7263D; --red-dark:#A3172B; --red-bg:#FDE4E6; --amber:#B4560A; --amber-bg:#FFF0DD; --ok:#11845B; --ok-bg:#E3F5EC; --blue:#1C5DB8;
  --font:system-ui,-apple-system,"Segoe UI","Arial Hebrew","Noto Sans Hebrew",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#161214;--surface:#211B1E;--ink:#F6EEF0;--muted:#B8A9AE;--line:#3A2C31;--red-bg:#3B1A20;--amber-bg:#3A2914;--ok-bg:#12332A;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:10px max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:6px 0 8px;display:grid;gap:8px}
.call{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--red);color:#fff;text-decoration:none;border-radius:20px;padding:16px;font-size:24px;font-weight:900;box-shadow:0 8px 24px rgba(215,38,61,.35)}
.call small{font-size:15px;font-weight:600;opacity:.9}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mini a,.mini button{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 4px;font:inherit;font-size:13px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;display:grid;gap:1px}
.mini b{font-size:16px}
.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.who button{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 4px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.who button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sit{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:14px 10px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;display:grid;gap:4px;justify-items:start;text-align:start;min-height:84px}
.sit i{font-style:normal;font-size:28px;line-height:1}
.sit.hot{border-color:var(--red);background:var(--red-bg)}
.guide{display:grid;gap:10px}
.guide h1{margin:0;font-size:clamp(26px,7vw,34px);line-height:1.15;font-weight:900}
.alert{padding:12px 14px;border-radius:16px;background:var(--red-bg);color:var(--red-dark);font-weight:800;font-size:17px}
@media (prefers-color-scheme:dark){.alert{color:#FF9AA6}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;font-size:19px;line-height:1.45}
.steps li::before{content:counter(s);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:900;font-size:20px}
.steps li.on{border-color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.steps li b{font-weight:800}
.dont{padding:12px 14px;border-radius:16px;background:var(--amber-bg);color:var(--amber);font-size:16px}
@media (prefers-color-scheme:dark){.dont{color:#FFC27A}}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.btn{appearance:none;border:0;border-radius:16px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;font-size:17px;padding:14px;cursor:pointer;text-align:center;text-decoration:none}
.btn.red{background:var(--red);color:#fff}.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* CPR */
.cpr{display:grid;justify-items:center;gap:12px;text-align:center}
.beat{width:min(70vw,280px);aspect-ratio:1;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:clamp(60px,20vw,96px);font-weight:900;transition:transform .08s ease-out;user-select:none}
.beat.push{transform:scale(.88)}
.beat.breath{background:var(--blue);font-size:clamp(26px,8vw,36px)}
.cpr .big{font-size:22px;font-weight:900}
.cpr .t{font-size:16px;color:var(--muted)}
.tog{display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:700;color:var(--muted)}
input,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:70px}
.idcard{display:grid;gap:6px;padding:16px;border-radius:18px;border:3px solid var(--red);background:var(--surface);font-size:19px}
.idcard b{color:var(--red)}
.note{margin:0;color:var(--muted);font-size:14px}
.loc{font-size:22px;font-weight:900;direction:ltr;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;max-width:90%}
@media (prefers-reduced-motion:reduce){.beat{transition:none}}
</style>
