<title>HaniaLimud · לימוד יומי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Noto+Serif+Hebrew:wght@500;600;700&display=swap">
<style>
/* The daily learning: today's daf (Daf Yomi) and today's halacha (Halakhah Yomit, Shulchan Arukh), with help.
   The texts come live from Sefaria: the Gemara with niqqud and the Steinsaltz explanation (William Davidson edition),
   Rashi and Tosafot line by line, and the Shulchan Arukh with the Rema. On top: a glossary of the common
   Aramaic terms, a short "how to learn" guide, AI help that reads the day's text (marked as such),
   a daily reminder at a chosen hour (none on Shabbat), and a streak of the days learned. */
:root{--k:#23356E;--k2:#C8963E;--ink:#1B2238;--muted:#5D6580;--line:#E6E1D3;--bg:#FBF8F1;--paper:#FFFDF8;--fs:21px;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Noto Serif Hebrew","Frank Ruhl Libre","David",serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{direction:rtl;margin:0;font-family:var(--font);font-size:16px;line-height:1.55;color:var(--ink);padding:12px max(16px,env(safe-area-inset-left,0px)) 56px;
  background:radial-gradient(70% 36% at 100% 0%,color-mix(in srgb,var(--k2) 22%,transparent),transparent 70%),radial-gradient(60% 30% at 0% 24%,color-mix(in srgb,var(--k) 12%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px}
.logo{font-weight:900;font-size:22px;color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px}.logo b{color:var(--k2)}.logo img{width:30px;height:30px;border-radius:9px}
header .sp{margin-inline-start:auto}
.streak{font-weight:800;font-size:14px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px}
.tabs button{appearance:none;border:0;background:none;border-radius:13px;padding:10px 4px;font:inherit;font-weight:800;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--k);color:#fff}
.hero{border-radius:26px;padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,var(--k),color-mix(in srgb,var(--k) 70%,#000));box-shadow:0 22px 40px -26px var(--k);display:grid;gap:8px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--k2) 60%,transparent),transparent 70%)}
.hero small{opacity:.85;font-weight:700}
.hero h1{margin:0;font:700 clamp(28px,8vw,40px)/1.15 var(--serif)}
.hero .nav{display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.hero .nav button{appearance:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:6px 12px;font:inherit;font-weight:800;cursor:pointer}
.hero .nav .d{margin-inline-start:auto;font-size:14px;opacity:.9}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px;box-shadow:0 1px 2px rgba(27,34,56,.05),0 14px 30px -22px rgba(35,53,110,.5)}
h2{margin:0;font-size:19px}h3{margin:0;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--k);background:color-mix(in srgb,var(--k) 9%,#fff);color:var(--k)}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;background:var(--k);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gold{background:var(--k2);color:#22180A}
.btn.ghost{background:#fff;color:var(--k);border:1.5px solid color-mix(in srgb,var(--k) 35%,#fff)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.55;cursor:default}
.amud{font-weight:900;color:var(--k2);font-size:14px;letter-spacing:.02em;border-bottom:2px solid var(--line);padding-bottom:4px}
.seg{display:grid;gap:8px;padding:12px 0;border-bottom:1px dashed var(--line)}
.seg:last-child{border-bottom:0}
.ar{font:500 var(--fs)/1.9 var(--serif);margin:0}
.ar b,.ar strong{font-weight:700}
.ex{font-size:calc(var(--fs) - 4px);line-height:1.75;margin:0;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--k) 5%,#fff);border-inline-start:4px solid color-mix(in srgb,var(--k) 45%,#fff)}
.ex b,.ex strong{color:var(--k)}
.ex .tr{color:#8A5A12;font-weight:600}
.cm{font-size:calc(var(--fs) - 5px);line-height:1.7;margin:0;padding:8px 12px;border-radius:12px;background:#FFF8E8;border:1px solid #F3E2B8}
.cm em{font-style:normal;font-weight:800;color:#8A5A12}
.terms{display:flex;gap:6px;flex-wrap:wrap}
.term{appearance:none;border:1px solid #E8D9B5;background:#FFFBF0;border-radius:10px;padding:3px 9px;font:inherit;font-size:13px;cursor:pointer;color:#6B4A10}
.term[aria-expanded="true"]{background:#F6E7C1}
.ai{border:1.5px dashed color-mix(in srgb,var(--k2) 60%,#fff);background:#FFFDF6}
.ai .ans{white-space:pre-wrap;font-size:16px;line-height:1.75;margin:0}
.ai .ans:empty{display:none}
.ai input{flex:1;min-width:0;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.fine{font-size:13px;color:var(--muted)}
.done{width:100%;font-size:17px;padding:14px}
.load{color:var(--muted);text-align:center;padding:30px 0}
.hal{font:500 var(--fs)/1.9 var(--serif);margin:0}
.hal .rema{display:block;margin-top:6px;padding:6px 10px;border-radius:10px;background:#F2F5FF;font-size:calc(var(--fs) - 3px)}
.hal .rema:before{content:"הגה (הרמ״א) · ";font:800 13px var(--font);color:var(--k)}
.seif{display:grid;gap:4px;padding:10px 0;border-bottom:1px dashed var(--line)}.seif:last-child{border:0}
.seif>small{font-weight:900;color:var(--k2)}
.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.glossary div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.glossary b{font-family:var(--serif);font-size:17px;display:block}
.steps{margin:0;padding-inline-start:20px;display:grid;gap:8px}
input[type=time],select{font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw}
a{color:var(--k)}
@media print{header,.tabs,#rem,#credit,.hero .nav,.row .btn,.toast{display:none!important}body{background:#fff;padding:0}.card{box-shadow:none;break-inside:avoid}.hero{color:#000;background:none;box-shadow:none;padding:0}}
:focus-visible{outline:3px solid var(--k2);outline-offset:2px}
</style>
<div class="wrap">
  <header><a class="logo" href="https://yahadut.hania360.com/"><img src="/icons/icon-192.png" alt=""><span>Hania<b>Limud</b></span></a><span class="sp"></span><span class="streak" id="streak"></span></header>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-daf" aria-selected="true">📜 דף יומי</button>
    <button role="tab" id="t-hal" aria-selected="false">⚖️ הלכה יומית</button>
    <button role="tab" id="t-par" aria-selected="false">🕯️ פרשה</button>
    <button role="tab" id="t-how" aria-selected="false">🧭 איך לומדים</button>
  </div>
  <section class="hero" id="hero" aria-live="polite"></section>
  <main id="main" style="display:grid;gap:14px"></main>
  <section class="card" id="rem"></section>
  <p class="fine" id="credit"></p>
</div>
<script src="/hebcal.js"></script>
<script>
