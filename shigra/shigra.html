<title>HaniaShigra · שגרת ערב ובוקר לילדים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Noto+Serif+Hebrew:wght@600;700&display=swap">
<style>
/* Layout: one big card at a time for the child (the step, its picture, a gentle clock, one big "done" button);
   the parents set the steps and the bedtime below. Evening is a calm night palette; morning is bright. */
:root{
  --bg:#FFF7EE; --surface:#FFFFFF; --ink:#26203F; --muted:#6E6890; --line:#F0E1CF; --main:#7A5CFA; --main2:#5B3FE0; --sun:#FFB53B; --ok:#1DB37C; --ok2:#DFF6EC;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Noto Serif Hebrew","David",serif; color-scheme:light;
}
.night{--bg:#141133;--surface:#1F1B4A;--ink:#F3F0FF;--muted:#B4ADDB;--line:#332D6B;--ok2:#163A33;color-scheme:dark}
@media (prefers-color-scheme:dark){html:not(.morning){--bg:#141133;--surface:#1F1B4A;--ink:#F3F0FF;--muted:#B4ADDB;--line:#332D6B;--ok2:#163A33;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{direction:rtl;margin:0;font-family:var(--font);font-size:17px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px;transition:background .4s;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px}
.logo{font-weight:900;font-size:24px;display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}.logo b{color:var(--main)}
.logo img{width:32px;height:32px;border-radius:9px}
header .sp{margin-inline-start:auto}
h1{font-weight:900;font-size:clamp(26px,7vw,36px);line-height:1.15;margin:0}
h2{font-weight:800;font-size:20px;margin:0}
p{margin:0}
.lead{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.btn{appearance:none;border:0;border-radius:18px;padding:14px 18px;font:inherit;font-weight:800;font-size:18px;cursor:pointer;background:var(--main);color:#fff;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 var(--main2)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--main2)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}
.btn.small{padding:8px 12px;font-size:15px;border-radius:12px;box-shadow:none}
.btn.go{background:var(--ok);box-shadow:0 6px 0 #138A5E}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 12px;font:inherit;font-weight:800;font-size:15.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--main);color:#fff;border-color:var(--main)}
input,select{font:inherit;font-size:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 11px}
label{display:grid;gap:4px;font-weight:700;font-size:14px;color:var(--muted)}
.fine{font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:80;max-width:90vw;text-align:center}
/* home */
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode button{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:14px;font:inherit;font-weight:900;font-size:19px;cursor:pointer;display:grid;gap:2px;justify-items:center}
.mode button span{font-size:40px;line-height:1}.mode button small{font-weight:600;color:var(--muted);font-size:13px}
.mode button[aria-pressed="true"]{border-color:var(--main);box-shadow:0 0 0 3px color-mix(in srgb,var(--main) 30%,transparent)}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kid{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:22px;padding:14px 10px;font:inherit;cursor:pointer;display:grid;gap:6px;justify-items:center;text-align:center}
.kid .av{font-size:48px;line-height:1}.kid b{font-size:19px}
.mini{height:10px;width:100%;border-radius:99px;background:var(--line);overflow:hidden}.mini i{display:block;height:100%;background:var(--ok)}
.clock{font-size:15px;font-weight:800;color:var(--muted);text-align:center}
/* the child's step */
.run{display:grid;gap:14px;justify-items:center;text-align:center}
.who{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;width:100%}
.who .sp{margin-inline-start:auto}
.step{width:100%;border-radius:30px;background:var(--surface);border:2px solid var(--line);padding:18px 14px 20px;display:grid;gap:10px;justify-items:center}
.step .em{font-size:min(34vw,150px);line-height:1;animation:pop .45s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.step .lb{font-size:clamp(28px,8vw,42px);font-weight:900;line-height:1.15}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p)*1%),var(--line) 0);display:grid;place-content:center}
.ring b{width:96px;height:96px;border-radius:50%;background:var(--surface);display:grid;place-content:center;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr}
.ring.over{background:conic-gradient(#FF8A65 100%,var(--line) 0)}
.ring.paused{filter:grayscale(.8);opacity:.75}
.chip.pz{padding:6px 12px;font-size:14px}
.dots button{appearance:none;font:inherit;cursor:pointer;color:inherit}
.done{font-size:clamp(24px,7vw,32px)!important;padding:18px 30px!important;width:100%}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots span,.dots button{font-size:24px;width:42px;height:42px;border-radius:12px;display:grid;place-content:center;background:var(--surface);border:2px solid var(--line)}
.dots span.ok{background:var(--ok2);border-color:var(--ok)}.dots span.cur{border-color:var(--main);transform:scale(1.12)}
.dots span.skip{opacity:.35}
/* good night */
.gn{text-align:center;justify-items:center}
.gn .moon{font-size:110px;line-height:1;filter:drop-shadow(0 0 30px rgba(255,220,120,.5))}
.shema{font-family:var(--serif);font-size:clamp(22px,6vw,30px);font-weight:700;line-height:1.7}
.night-light{position:fixed;inset:0;z-index:70;background:#05030F;display:grid;place-content:center;cursor:pointer}
.night-light canvas{position:absolute;inset:0;width:100%;height:100%}
.night-light p{position:relative;color:#5A5390;font-size:14px;text-align:center;margin-top:60vh}
/* parents */
.steps{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:48px minmax(0,1fr) 66px auto;gap:5px;align-items:center}
.srow select.em{font-size:24px;padding:4px;text-align:center}
.srow input{width:100%}
.srow .ctl{display:flex;gap:2px}
.srow .ctl button{appearance:none;border:0;background:var(--bg);color:var(--ink);border-radius:8px;width:26px;height:34px;font-size:13px;cursor:pointer;padding:0}
.srow select{padding:8px 4px}
.srow .who{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.srow .who .chip{padding:4px 10px;font-size:13.5px;border-radius:10px}.srow .who small{color:var(--muted);font-size:12.5px}
.hair{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}.hair p{width:100%;text-align:center;margin:0}.hair .chip{font-size:17px;padding:10px 14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:12.5px}
.week div{display:grid;gap:2px;justify-items:center}
.week i{display:block;width:70%;background:var(--sun);border-radius:6px 6px 2px 2px;min-height:3px}
.week .col{height:70px;display:flex;align-items:flex-end;justify-content:center;width:100%}
.prize{display:grid;gap:6px}
.big-bar{height:18px;border-radius:99px;background:var(--line);overflow:hidden}.big-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#FF8A65);border-radius:99px}
details summary{cursor:pointer;font-weight:800;font-size:17px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
