.night{--bg:#141133;--surface:#1F1B4A;--ink:#F3F0FF;--muted:#B4ADDB;--line:#332D6B;--ok2:#163A33;color-scheme:dark}

.logo img{width:32px;height:32px;border-radius:9px}
header .sp{margin-inline-start:auto}
h1{font-weight:900;font-size:clamp(26px,7vw,36px);line-height:1.15;margin:0}
h2{font-weight:800;font-size:20px;margin:0}
p{margin:0}
.lead{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.btn{appearance:none;border:0;border-radius:18px;padding:14px 18px;font:inherit;font-weight:800;font-size:18px;cursor:pointer;background:var(--main);color:#fff;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 var(--main2)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 12px;font:inherit;font-weight:800;font-size:15.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--main);color:#fff;border-color:var(--main)}
input,select{font:inherit;font-size:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 11px}

.join{border:2px solid var(--main)}

.chip.pz{padding:6px 12px;font-size:14px}
.dots button{appearance:none;font:inherit;cursor:pointer;color:inherit}
.done{font-size:clamp(24px,7vw,32px)!important;padding:18px 30px!important;width:100%}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots span,.dots button{font-size:24px;width:42px;height:42px;border-radius:12px;display:grid;place-content:center;background:var(--surface);border:2px solid var(--line)}

.night-light p{position:relative;color:#5A5390;font-size:14px;text-align:center;margin-top:60vh}

.steps{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:48px minmax(0,1fr) 66px auto;gap:5px;align-items:center}
.srow select.em{font-size:24px;padding:4px;text-align:center}

.prize{display:grid;gap:6px}
.big-bar{height:18px;border-radius:99px;background:var(--line);overflow:hidden}.big-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#FF8A65);border-radius:99px}
details summary{cursor:pointer;font-weight:800;font-size:17px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
