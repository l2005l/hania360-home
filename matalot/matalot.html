<title>HaniaMatalot · מטלות הבית לילדים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap">
<style>
/* HaniaMatalot: household chores for the children, apart from the morning and evening routine. Each child has their
   own chores (a small child can have none), on the days chosen; a chore nobody likes can rotate between children
   each week. The child marks ✓, a parent approves, points add up to a weekly prize or pocket money. Both parents see
   the same thing (the family copy is in shigra/family.js, kind "chores"). */
:root{--bg:#F2F8FF;--card:#fff;--ink:#132238;--muted:#5D6B82;--line:#DCE6F2;--main:#0A75A6;--main2:#02699F;--ok:#16A34A;--warn:#F59E0B;--pink:#F472B6;--font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif}

*{box-sizing:border-box}[hidden]{display:none!important}
body{direction:rtl;margin:0;font-family:var(--font);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg)}
body.inhub header{display:none}
.wrap{max-width:720px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 60px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{font-weight:900;font-size:21px;color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px}.logo b{color:var(--main)}.logo img{width:30px;height:30px;border-radius:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px;box-shadow:0 14px 30px -26px rgba(10,40,80,.45)}
h1{margin:0;font-size:clamp(24px,6vw,32px)}h2{margin:0;font-size:19px}h3{margin:0;font-size:16px}
.lead{margin:0;color:var(--muted)}.fine{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:0;border-radius:16px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;background:var(--main);color:#fff;box-shadow:0 4px 0 var(--main2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--main2)}
.btn.ghost{background:var(--card);color:var(--main2);border:1.5px solid var(--line);box-shadow:none}
.btn.small{padding:7px 11px;font-size:14px;border-radius:12px}.btn.ok{background:var(--ok);box-shadow:0 4px 0 #0F7A35}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--main);background:color-mix(in srgb,var(--main) 14%,var(--card));color:var(--main2)}
.hero{background:linear-gradient(135deg,#0A75A6,#6366F1 60%,#F472B6);color:#fff;border:0}.hero .lead,.hero .fine{color:rgba(255,255,255,.9)}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kid{appearance:none;font:inherit;color:inherit;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 8px;display:grid;justify-items:center;gap:2px}
.kid[aria-pressed="true"]{border-color:var(--main);box-shadow:0 0 0 3px color-mix(in srgb,var(--main) 25%,transparent)}
.kid .av{font-size:38px;line-height:1.1}.kid b{font-size:17px}.kid small{color:var(--muted);font-size:12.5px}
.ch{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--bg);border:1.5px solid var(--line)}
.ch .e{font-size:34px;width:44px;text-align:center}.ch .x{flex:1;min-width:0}.ch .x b{display:block;font-size:17px}.ch .x small{color:var(--muted)}
.ch.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));background:color-mix(in srgb,var(--ok) 9%,var(--card))}
.ch.wait{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--card))}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22C55E,#0A75A6);border-radius:9px}
.grid7{display:grid;grid-template-columns:110px repeat(7,1fr);gap:4px;font-size:13px;align-items:center}
.grid7 .h{text-align:center;color:var(--muted);font-weight:700}.grid7 .c{text-align:center;border-radius:8px;padding:4px 0;background:var(--bg)}.grid7 .c.on{background:color-mix(in srgb,var(--ok) 22%,var(--card));font-weight:800}
details.par>summary{cursor:pointer;font-weight:800;list-style:none;padding:12px 14px;border-radius:16px;background:var(--card);border:1.5px dashed var(--line)}
details.par>summary::-webkit-details-marker{display:none}
.edit{display:grid;gap:8px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--bg)}
.edit input[type=text],.edit select,.inp{font:inherit;padding:9px 11px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#132238;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.burst{position:fixed;pointer-events:none;font-size:28px;z-index:70;animation:up 1s ease-out forwards}@keyframes up{to{transform:translateY(-120px) scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst{display:none}}
button.e{appearance:none;border:0;background:none;padding:0;cursor:pointer;position:relative;line-height:1.1}
button.e::after{content:"🔊";position:absolute;bottom:-4px;left:-6px;font-size:13px;opacity:.75}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk span{display:grid;justify-items:center;gap:1px;border-radius:12px;padding:4px 0;background:var(--bg);font-size:12px;color:var(--muted);font-weight:700}
.wk span i{font-style:normal;font-size:16px;line-height:1.2}.wk span.now{outline:2px solid var(--main);outline-offset:-2px;color:var(--main2)}
.wk span.all{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:#166534}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:#C2410C;background:#FFEDD5;border-radius:999px;padding:3px 10px;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:800;color:#7C3AED;background:#EDE9FE;border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:2px}
.party{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.party i{position:absolute;top:-30px;font-style:normal;font-size:26px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.party b{position:absolute;left:50%;top:38%;transform:translateX(-50%);width:max-content;max-width:88vw;text-align:center;font-size:clamp(24px,7vw,40px);font-weight:900;color:var(--ink);background:var(--card);border:3px solid var(--warn);border-radius:24px;padding:14px 22px;box-shadow:0 20px 50px -20px rgba(0,0,0,.45);animation:pop .5s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.party i{display:none}}
</style>
