<title>HaniaHaktava · הכתבה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap">
<style>
/* Dictation for school: a parent types the week's words (Hebrew or English) once; the phone reads them one by one
   while the child writes on paper (or types them on the phone), then they check together. Mistakes go to a short
   practice round. Everything stays on this phone; inside HaniaKids each child sees his own lists and earns stars. */
:root{--bg:#F2F7FF;--surface:#fff;--ink:#14213D;--muted:#5B6787;--line:#DCE6F5;--main:#2E7BFF;--main2:#1B5FD6;--ok:#14B37D;--bad:#FF5D5D;--sun:#FFC83D;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1726;--surface:#18233A;--ink:#EAF1FF;--muted:#9FB0CF;--line:#2A3956}}
:root[data-theme="dark"]{--bg:#0F1726;--surface:#18233A;--ink:#EAF1FF;--muted:#9FB0CF;--line:#2A3956}
*{box-sizing:border-box}[hidden]{display:none!important}
body{direction:rtl;margin:0;font-family:var(--font);font-size:16px;line-height:1.5;color:var(--ink);background:radial-gradient(70% 34% at 100% 0%,color-mix(in srgb,var(--main) 16%,transparent),transparent 70%),var(--bg);background-attachment:fixed;padding:12px max(16px,env(safe-area-inset-left,0px)) 60px}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px}.logo{font-weight:900;font-size:22px;color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px}.logo b{color:var(--main)}.logo img{width:30px;height:30px;border-radius:9px}
body.inhub header{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px;box-shadow:0 14px 30px -24px rgba(20,33,61,.5)}
h1{margin:0;font-size:clamp(26px,7vw,34px);line-height:1.15}h2{margin:0;font-size:19px}
.lead{margin:0;color:var(--muted)}.fine{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:0;border-radius:16px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--main);color:#fff;box-shadow:0 4px 0 var(--main2);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--main2)}
.btn.ghost{background:var(--surface);color:var(--main);border:1.5px solid var(--line);box-shadow:none}
.btn.small{padding:8px 13px;font-size:14px;border-radius:12px}
.btn.big{font-size:20px;padding:16px;width:100%}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #0E8F63}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--main);background:color-mix(in srgb,var(--main) 12%,var(--surface));color:var(--main)}
.list{display:flex;gap:12px;align-items:center;text-align:start;width:100%;appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;cursor:pointer;font:inherit;color:inherit}
.list .e{font-size:30px}.list b{display:block;font-size:17px}
input[type=text],textarea{width:100%;font:inherit;font-size:18px;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--surface);color:var(--ink)}
textarea{min-height:190px;line-height:1.7}
.say{width:120px;height:120px;border-radius:50%;font-size:52px;margin:0 auto;display:grid;place-items:center;appearance:none;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#6FA4FF,var(--main));color:#fff;box-shadow:0 14px 30px -12px var(--main)}
.say.on{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.say.on{animation:none}}
.num{font-size:15px;font-weight:800;color:var(--muted);text-align:center}
.peek{font-size:clamp(34px,10vw,52px);font-weight:900;text-align:center;min-height:1.3em;letter-spacing:.02em}
.peek.hide{color:transparent;text-shadow:0 0 18px color-mix(in srgb,var(--ink) 50%,transparent);user-select:none}
.chk{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0}
.chk .w{font-size:24px;font-weight:800}.chk .n{color:var(--muted);font-weight:700;min-width:1.6em}
.chk button{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:12px;font-size:20px;width:46px;height:42px;cursor:pointer}
.chk button[aria-pressed="true"].y{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.chk button[aria-pressed="true"].x{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.big2{font-size:56px;text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
<div class="wrap">
  <header><a class="logo" href="https://kids.hania360.com/"><img src="/icons/icon-192.png" alt=""><span>Hania<b>Haktava</b></span></a></header>
  <main id="app" style="display:grid;gap:14px"></main>
</div>
