<title>HaniaKasefet · הכספת שלי</title>
<style>
:root{--bg:#0B1220;--card:#121B2E;--card2:#17223A;--line:#24324D;--ink:#EAF0FA;--muted:#93A3BE;--gold:#E8B04A;--gold2:#F5CE7A;--ok:#3BCB8A;--warn:#F2B33D;--bad:#F06A6A;--blue:#6AA8FF;--r:16px;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Rubik,Arial,sans-serif}
body{min-height:100vh;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:0}h2{font-size:1.15rem;margin:0 0 10px}h3{font-size:1rem;margin:0 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:.86rem}.tiny{font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapx{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1405;border:0}
.btn.ghost{background:transparent}.btn.sm{padding:6px 10px;font-size:.88rem;border-radius:10px}
.btn.danger{border-color:#6b2a2a;color:#ffb4b4}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:#0E1628;border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
label.f{display:block;margin:0 0 10px}label.f>span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.top{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px}.logo svg{width:34px;height:34px}
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:6;background:#0E1628;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;padding:4px 6px;cursor:pointer;min-width:58px}
.tabs button b{font-size:1.25rem;line-height:1}
.tabs button[aria-selected=true]{color:var(--gold2)}
.big{font-size:2rem;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}.kpi span{font-size:.82rem;color:var(--muted)}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:10px 12px;cursor:pointer;text-align:start;width:100%}
.item .ic{font-size:1.3rem;flex:none;width:30px;text-align:center}
.item .mid{flex:1;min-width:0}.item .mid b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .end{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:700;background:#24324D}
.pill.ok{background:#123d2c;color:#7ff0bb}.pill.warn{background:#4a3a12;color:#ffd77a}.pill.bad{background:#4a1d1d;color:#ffb0b0}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.sec h2{margin:0}
.bar{height:10px;border-radius:99px;background:#1d2945;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:.84rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-inline-end:6px;vertical-align:-1px}
.check{display:flex;gap:10px;padding:12px;border-radius:13px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.check .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.check.ok .dot{background:var(--ok)}.check.warn .dot{background:var(--warn)}.check.bad .dot{background:var(--bad)}.check.info .dot{background:var(--blue)}
.check b{display:block}.check p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.check .act{color:var(--ink);font-size:.9rem;margin-top:4px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:0;width:min(560px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .dh{position:sticky;top:0;background:var(--card);padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
dialog .db{padding:16px}
dialog .df{position:sticky;bottom:0;background:var(--card);padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.lock{min-height:100vh;display:grid;place-items:center;padding:20px}
.lock .card{width:min(460px,100%)}
.strength{height:6px;border-radius:99px;background:#1d2945;margin-top:6px;overflow:hidden}.strength i{display:block;height:100%;transition:width .2s}
.kit{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;background:#0E1628;border:1px dashed var(--gold);border-radius:12px;padding:12px;word-break:break-all;font-size:.95rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#EAF0FA;color:#0B1220;padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed=true]{background:var(--gold);color:#1b1405;border-color:var(--gold)}
.ai{white-space:pre-wrap;line-height:1.7}
.note{font-size:.8rem;color:var(--muted);border-inline-start:3px solid var(--gold);padding-inline-start:10px;margin:10px 0}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}table.t th{color:var(--muted);font-weight:600}
.fit{font-weight:800}.fit.y{color:var(--ok)}.fit.m{color:var(--warn)}.fit.n{color:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}
.hide{display:none!important}
@media(max-width:420px){.grid2{grid-template-columns:1fr}.big{font-size:1.7rem}}
</style>
