<title>HaniaFit · אימון ותזונה אישיים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap">
<style>
/* HaniaFit: a personal training plan and eating plan from a few questions (age, height, weight, goal, where you
   train, how many days), a workout player with moving demos, rest timer and sound, foods with swaps for what you do
   not like (kosher: no meat with dairy), reminders on training days (never on Shabbat), and progress that keeps you
   going. Everything is calculated on the phone and stays there. */
:root{--bg:#F3F6F4;--surface:#fff;--ink:#14231C;--muted:#5B6B63;--line:#DDE6E1;--main:#0D7F4A;--main2:#079455;--dark:#0B3B2A;--hot:#FF6B35;--warn:#F5A524;--blue:#3B82F6;--fig:#22303A;--fig2:#A2ADB8;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0C1411;--surface:#15211C;--ink:#E9F3EE;--muted:#9DB0A6;--line:#26372F;--fig:#E3ECE8;--fig2:#5E6F68}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{direction:rtl;margin:0;font-family:var(--font);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 110px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{font-weight:900;font-size:21px;color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px}.logo b{color:var(--main)}.logo img{width:30px;height:30px;border-radius:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px;box-shadow:0 14px 30px -26px rgba(10,60,40,.5)}
h1{margin:0;font-size:clamp(26px,7vw,36px);line-height:1.15}h2{margin:0;font-size:19px}h3{margin:0;font-size:16px}
.lead{margin:0;color:var(--muted)}.fine{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:0;border-radius:16px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--main);color:#fff;box-shadow:0 4px 0 var(--main2);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--main2)}
.btn.ghost{background:var(--surface);color:var(--main2);border:1.5px solid var(--line);box-shadow:none}
.btn.small{padding:8px 12px;font-size:14px;border-radius:12px}.btn.wide{width:100%}.btn.big{font-size:20px;padding:17px}
.btn.hot{background:var(--hot);box-shadow:0 4px 0 #D9480F}
.btn:disabled{opacity:.45;cursor:default}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--main);background:color-mix(in srgb,var(--main) 14%,var(--surface));color:var(--main2)}
.opt{appearance:none;width:100%;text-align:right;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}
.opt .e{font-size:28px}.opt b{display:block;font-size:17px}.opt small{color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--main);background:color-mix(in srgb,var(--main) 10%,var(--surface))}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:grid;gap:4px;font-weight:700;font-size:14px}
label.f input,select{font:inherit;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px;width:100%}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--main),#4ADE80);border-radius:9px;transition:width .3s}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{appearance:none;border:0;background:none;font:inherit;font-size:12px;font-weight:700;color:var(--muted);display:grid;justify-items:center;gap:1px;padding:4px 10px;cursor:pointer;border-radius:12px;min-width:64px}
nav.tabs button span{font-size:22px;line-height:1.1}
nav.tabs button[aria-selected="true"]{color:var(--main2);background:color-mix(in srgb,var(--main) 12%,transparent)}
.hero{background:linear-gradient(135deg,#0B3B2A,#0D7F4A);color:#fff;border:0}
.hero .lead,.hero .fine{color:rgba(255,255,255,.85)}
.ring{width:84px;height:84px;flex:0 0 auto}
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.kp{grid-template-columns:repeat(4,minmax(0,1fr))}}
.k{background:var(--bg);border-radius:16px;padding:10px;text-align:center}.k b{display:block;font-size:22px;font-weight:900}.k span{font-size:12.5px;color:var(--muted)}
.exrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .fig{width:74px;height:62px;flex:0 0 auto;background:var(--bg);border-radius:12px}
.exrow .x{flex:1;min-width:0}.exrow b{display:block}.exrow small{color:var(--muted)}
.mini{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.fig{display:block;width:100%;height:auto}
.day{border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.day>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center}
.day>summary::-webkit-details-marker{display:none}
.day .dn{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--main) 15%,var(--surface));display:grid;place-items:center;font-weight:900;color:var(--main2)}
.day .db{padding:0 14px 10px}
.meal{display:grid;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.meal h3 small{color:var(--muted);font-weight:500;font-size:13px}
.food{display:flex;gap:8px;align-items:center;padding:4px 0}
.food .x{flex:1;min-width:0}.food small{color:var(--muted)}
.tag{font-size:11.5px;font-weight:800;border-radius:7px;padding:1px 7px;background:var(--bg);color:var(--muted)}
.gauge{position:relative;height:14px;border-radius:9px;background:linear-gradient(90deg,#60A5FA 0 14%,#22C55E 14% 40%,#F59E0B 40% 60%,#EF4444 60%)}
.gauge i{position:absolute;top:-5px;width:6px;height:24px;border-radius:4px;background:var(--ink);transform:translateX(50%)}
.gl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);direction:ltr}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{aspect-ratio:1;border-radius:7px;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--muted)}
.cal i.on{background:var(--main);color:#fff}.cal i.today{outline:2px solid var(--hot)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{text-align:center;padding:10px 6px;border-radius:16px;background:var(--bg);font-size:12.5px;font-weight:700}
.badge span{display:block;font-size:30px}.badge.off{opacity:.35;filter:grayscale(1)}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0B3B2A;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
.ov .wrap{padding-bottom:40px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,20,14,.55);display:grid;place-items:end center}
.modal>div{background:var(--surface);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;display:grid;gap:10px}
/* the player */
.pl{min-height:100vh;display:flex;flex-direction:column}
.pl .top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px}
.pl .top .prog{flex:1}
.pl .stage{flex:1;display:grid;align-content:start;gap:12px;padding:6px 16px 20px;max-width:640px;width:100%;margin:0 auto}
.pl .figbox{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:8px;aspect-ratio:6/5;max-height:42vh;display:grid;place-items:center}
.pl .figbox svg{max-height:100%}
.pl h1{text-align:center;font-size:26px}
.pl .sub{text-align:center;color:var(--muted);font-weight:700}
.big{font-size:56px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.step{display:flex;align-items:center;justify-content:center;gap:14px}
.step button{width:52px;height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font:inherit;font-size:26px;font-weight:800;color:var(--ink);cursor:pointer}
.step b{font-size:40px;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.step small{display:block;text-align:center;color:var(--muted);font-size:13px}
.cues{margin:0;padding-inline-start:20px;color:var(--muted);font-size:15px}
.timer{width:200px;height:200px;margin:0 auto;display:block}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--main)}.dots i.now{background:var(--hot)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.conf span{position:absolute;top:-30px;font-size:26px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
</style>
